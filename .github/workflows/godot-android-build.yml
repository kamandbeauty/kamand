name: Godot Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: godot-android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"
  GODOT_TEMPLATES_DIR: "/home/runner/.local/share/godot/export_templates/4.5.1.stable"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  CI_PROJECT: "/tmp/kamand-android-build"

jobs:
  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.5.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_DIR"

          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$url" \
            --output /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$GODOT_DIR"

          binary="$(
            find "$GODOT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "Godot_v*_linux.x86_64" \
              | head -n 1
          )"

          if [ -z "$binary" ]; then
            echo "::error::Godot binary was not found"
            ls -la "$GODOT_DIR"
            exit 1
          fi

          mv "$binary" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_DIR/godot" --version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_TEMPLATES_DIR"

          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$url" \
            --output /tmp/export-templates.tpz

          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates

          unzip -q \
            /tmp/export-templates.tpz \
            -d /tmp/export-templates

          if [ -d "/tmp/export-templates/templates" ]; then
            cp -R \
              /tmp/export-templates/templates/. \
              "$GODOT_TEMPLATES_DIR/"
          else
            cp -R \
              /tmp/export-templates/. \
              "$GODOT_TEMPLATES_DIR/"
          fi

          if [ ! -f "$GODOT_TEMPLATES_DIR/android_debug.apk" ]; then
            echo "::error::Android debug template not found"
            exit 1
          fi

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          adb version

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "project.godot"
            "export_presets.cfg"
            "scenes/main/Main.tscn"
            "resources/levels/Level1.tres"
            "scripts/main.gd"
            "scripts/player/Player.gd"
            "scripts/player/SoldierFormation.gd"
            "scripts/enemy/Enemy.gd"
            "scripts/enemy/EnemyManager.gd"
            "scripts/systems/Projectile.gd"
            "tests/test_game_logic.gd"
            "assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
            "assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"
            "assets/toon_shooter_game_kit/Weapons/SMG.gltf"
            "assets/toon_shooter_game_kit/Weapons/Pistol.gltf"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found"
              exit 1
            fi
          done

      - name: Create lightweight Android build project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$CI_PROJECT"

          mkdir -p \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters" \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Weapons" \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Environment"

          rsync -a \
            --exclude=".git" \
            --exclude=".godot" \
            --exclude="assets" \
            --exclude="build" \
            ./ \
            "$CI_PROJECT/"

          cp assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters/"

          cp assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters/"

          cp assets/toon_shooter_game_kit/Weapons/SMG.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Weapons/"

          cp assets/toon_shooter_game_kit/Weapons/Pistol.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Weapons/"

          echo "Lightweight project created."

      - name: Parse Godot project
        shell: bash
        run: |
          set -euo pipefail

          timeout \
            --signal=TERM \
            --kill-after=20s \
            600s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --editor \
              --quit \
              --verbose

      - name: Run logic tests
        shell: bash
        run: |
          set -euo pipefail

          timeout 120s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --script res://tests/test_game_logic.gd

      - name: Run Main Scene smoke test
        shell: bash
        run: |
          set -euo pipefail

          timeout 180s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --quit-after 5 \
              --verbose

      - name: Export Android ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/android"

          "$GODOT_DIR/godot" \
            --headless \
            --path "$CI_PROJECT" \
            --export-debug \
            "Android ARM64 Debug" \
            "$GITHUB_WORKSPACE/build/android/Level1-Visual-Test.apk"

          if [ ! -f "$GITHUB_WORKSPACE/build/android/Level1-Visual-Test.apk" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          if [ ! -s "$GITHUB_WORKSPACE/build/android/Level1-Visual-Test.apk" ]; then
            echo "::error::APK file is empty"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/build/android/Level1-Visual-Test.apk"

      - name: Validate APK architecture
        shell: bash
        run: |
          set -euo pipefail

          unzip -l build/android/Level1-Visual-Test.apk \
            | grep -q "lib/arm64-v8a"

          echo "ARM64 APK validation passed."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: level1-android-apk
          path: build/android/Level1-Visual-Test.apk
          if-no-files-found: error
          retention-days: 14
