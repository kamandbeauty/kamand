name: Godot Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: godot-android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"
  GODOT_TEMPLATES_DIR: "/home/runner/.local/share/godot/export_templates/4.5.1.stable"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_DIR"

          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$URL" \
            --output /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$GODOT_DIR"

          GODOT_BINARY="$(
            find "$GODOT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "Godot_v*_linux.x86_64" \
              | head -n 1
          )"

          if [ -z "$GODOT_BINARY" ]; then
            echo "::error::Godot binary not found"
            ls -la "$GODOT_DIR"
            exit 1
          fi

          mv "$GODOT_BINARY" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_DIR/godot" --version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_TEMPLATES_DIR"

          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$URL" \
            --output /tmp/export-templates.tpz

          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates

          unzip -q \
            /tmp/export-templates.tpz \
            -d /tmp/export-templates

          if [ -d "/tmp/export-templates/templates" ]; then
            cp -R \
              /tmp/export-templates/templates/. \
              "$GODOT_TEMPLATES_DIR/"
          else
            cp -R \
              /tmp/export-templates/. \
              "$GODOT_TEMPLATES_DIR/"
          fi

          if [ ! -f "$GODOT_TEMPLATES_DIR/android_debug.apk" ]; then
            echo "::error::Android debug export template not found"
            exit 1
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "project.godot"
            "export_presets.cfg"
            "scenes/main/Main.tscn"
            "resources/levels/Level1.tres"
            "scripts/main.gd"
            "scripts/player/Player.gd"
            "scripts/player/SoldierFormation.gd"
            "scripts/enemy/Enemy.gd"
            "scripts/enemy/EnemyManager.gd"
            "scripts/systems/Projectile.gd"
            "tests/test_game_logic.gd"
            "assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
            "assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"
            "assets/toon_shooter_game_kit/Weapons/SMG.gltf"
            "assets/toon_shooter_game_kit/Weapons/Pistol.gltf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Validate Android preset
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'name="Android ARM64 Debug"' export_presets.cfg
          grep -Fq 'platform="Android"' export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fq 'architectures/armeabi-v7a=false' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=false' export_presets.cfg

          echo "Android ARM64 Debug preset is valid."

      - name: Parse Godot project
        shell: bash
        run: |
          set -euo pipefail

          timeout \
            --signal=TERM \
            --kill-after=20s \
            600s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --editor \
              --quit \
              --verbose

      - name: Run logic tests
        shell: bash
        run: |
          set -euo pipefail

          timeout 120s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --script res://tests/test_game_logic.gd

      - name: Run Main Scene smoke test
        shell: bash
        run: |
          set -euo pipefail

          timeout 180s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --quit-after 5 \
              --verbose

      - name: Export Android ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/android"

          APK_PATH="$GITHUB_WORKSPACE/build/android/kamand-arm64-debug.apk"

          "$GODOT_DIR/godot" \
            --headless \
            --path . \
            --export-debug \
            "Android ARM64 Debug" \
            "$APK_PATH"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file is empty"
            exit 1
          fi

          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Validate APK architecture
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="build/android/kamand-arm64-debug.apk"

          if ! unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a"; then
            echo "::error::ARM64 library was not found in APK"
            exit 1
          fi

          echo "ARM64 APK validation passed."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamand-android-arm64-debug
          path: build/android/kamand-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
