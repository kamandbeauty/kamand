name: Godot Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: godot-android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"
  GODOT_TEMPLATES_DIR: "/home/runner/.local/share/godot/export_templates/4.5.1.stable"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.5.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_DIR"

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$DOWNLOAD_URL" \
            --output /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$GODOT_DIR"

          GODOT_BINARY="$(
            find "$GODOT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "Godot_v*_linux.x86_64" \
              | head -n 1
          )"

          if [ -z "$GODOT_BINARY" ]; then
            echo "::error::Godot binary was not found"
            ls -la "$GODOT_DIR"
            exit 1
          fi

          mv "$GODOT_BINARY" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_DIR/godot" --version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_TEMPLATES_DIR"

          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "$TEMPLATES_URL" \
            --output /tmp/godot-export-templates.tpz

          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates

          unzip -q \
            /tmp/godot-export-templates.tpz \
            -d /tmp/godot-export-templates

          if [ -d "/tmp/godot-export-templates/templates" ]; then
            cp -R \
              /tmp/godot-export-templates/templates/. \
              "$GODOT_TEMPLATES_DIR/"
          else
            cp -R \
              /tmp/godot-export-templates/. \
              "$GODOT_TEMPLATES_DIR/"
          fi

          if [ ! -f "$GODOT_TEMPLATES_DIR/android_debug.apk" ]; then
            echo "::error::Android debug export template was not found"
            exit 1
          fi

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          adb version

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "project.godot"
            "export_presets.cfg"
            "scenes/main/Main.tscn"
            "resources/levels/Level1.tres"
            "resources/levels/LevelData.gd"
            "scripts/main.gd"
            "scripts/player/Player.gd"
            "scripts/player/SoldierFormation.gd"
            "scripts/enemy/Enemy.gd"
            "scripts/enemy/EnemyManager.gd"
            "scripts/systems/Projectile.gd"
            "tests/test_game_logic.gd"
            "assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
            "assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"
            "assets/toon_shooter_game_kit/Weapons/SMG.gltf"
            "assets/toon_shooter_game_kit/Weapons/Pistol.gltf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Validate Android export preset
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'name="Android ARM64 Debug"' export_presets.cfg
          grep -Fq 'platform="Android"' export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fq 'architectures/armeabi-v7a=false' export_presets.cfg

          echo "Android ARM64 export preset found."

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -uo pipefail

          LOG_FILE="/tmp/godot-import.log"

          timeout \
            --signal=TERM \
            --kill-after=15s \
            600s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --import \
              --verbose \
              2>&1 | tee "$LOG_FILE"

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Godot import completed successfully."
            exit 0
          fi

          if [ "$EXIT_CODE" -eq 124 ]; then
            if grep -q "\[ DONE \].*_update_scan_actions" "$LOG_FILE"; then
              echo "::warning::Godot scan completed before timeout; continuing to export."
              exit 0
            fi

            echo "::error::Godot import timed out before scan completion."
            exit 1
          fi

          echo "::error::Godot import failed with exit code $EXIT_CODE."
          exit "$EXIT_CODE"

      - name: Run logic tests
        shell: bash
        run: |
          set -euo pipefail

          timeout \
            --signal=TERM \
            --kill-after=10s \
            120s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --script res://tests/test_game_logic.gd

      - name: Run Main Scene smoke test
        shell: bash
        run: |
          set -uo pipefail

          LOG_FILE="/tmp/godot-runtime.log"

          timeout \
            --signal=TERM \
            --kill-after=15s \
            180s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --quit-after 5 \
              --verbose \
              2>&1 | tee "$LOG_FILE"

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 124 ]; then
            echo "::error::Main Scene smoke test failed."
            exit "$EXIT_CODE"
          fi

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "::warning::Smoke test reached timeout after launching Main Scene."
          else
            echo "Main Scene smoke test completed."
          fi

      - name: Export Android ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/android

          "$GODOT_DIR/godot" \
            --headless \
            --path . \
            --export-debug \
            "Android ARM64 Debug" \
            build/android/Level1-Visual-Test.apk

          if [ ! -f "build/android/Level1-Visual-Test.apk" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          if [ ! -s "build/android/Level1-Visual-Test.apk" ]; then
            echo "::error::APK file is empty"
            exit 1
          fi

          ls -lh build/android/Level1-Visual-Test.apk
          file build/android/Level1-Visual-Test.apk

      - name: Validate APK architecture
        shell: bash
        run: |
          set -euo pipefail

          if ! unzip -l build/android/Level1-Visual-Test.apk \
            | grep -q "lib/arm64-v8a"; then
            echo "::error::ARM64 library was not found in APK"
            exit 1
          fi

          echo "ARM64 library found in APK."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: level1-android-apk
          path: build/android/Level1-Visual-Test.apk
          if-no-files-found: error
          retention-days: 14
