name: Android CI

# Builds the Modir Forushgah app on a real runner (JDK 17 + Android SDK +
# network): runs all JVM unit tests (JVM + Robolectric) and produces the
# debug APK. Results are uploaded as artifacts and test reports.
on:
  push:
    branches:
      - "arena/01a03314-kamand"
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Xmx3g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle version
        run: ./gradlew --version

      - name: Run unit tests (JVM + Robolectric)
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Relay gradle failure to ci-logs
        if: failure()
        run: |
          set +e
          git config user.name ci-relay; git config user.email ci-relay@users.noreply.github.com
          git fetch origin ci-logs:refs/remotes/origin/ci-logs 2>/dev/null || true
          git checkout -f -B ci-logs origin/ci-logs 2>/dev/null || git checkout -f -B ci-logs
          # record run metadata + the tail of the gradle log (captured by the
          # test/build steps via tee into gradle-build.log) so the failure is
          # readable even when log downloads are unavailable.
          {
            echo "run: $GITHUB_RUN_ID"
            echo "sha: $GITHUB_SHA"
            echo "time: $(date -u)"
            echo "----- gradle log tail -----"
            tail -n 400 gradle-build.log 2>/dev/null || echo "(gradle-build.log not found)"
          } > last-error.log
          git add last-error.log && git commit -m "CI error $GITHUB_SHA" && git push -f origin ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
