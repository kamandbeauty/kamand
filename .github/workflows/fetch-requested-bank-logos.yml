name: Fetch requested bank logos

on:
  push:
    branches:
      - arena/01a0ed0e-kamand
    paths:
      - .github/workflows/fetch-requested-bank-logos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: arena/01a0ed0e-kamand

      - name: Download exact requested images
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output assets/images/banks/mehriran.png \
            'https://way2pay.ir/wp-content/uploads/Mehr-Small-banner-1-way2pay-93-07-19.png'
          curl --fail --location --retry 3 \
            --output assets/images/banks/refah.png \
            'https://sibche.com/blog/wp-content/uploads/2025/11/%D9%84%D9%88%DA%AF%D9%88-%D8%A8%D8%A7%D9%86%DA%A9-%D8%B1%D9%81%D8%A7%D9%87_2.png'

      - name: Validate downloaded PNG files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          for path in (
              Path('assets/images/banks/mehriran.png'),
              Path('assets/images/banks/refah.png'),
          ):
              data = path.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'{path} is not a PNG file')
              width, height = struct.unpack('>II', data[16:24])
              if width < 32 or height < 32:
                  raise SystemExit(f'{path} has invalid dimensions: {width}x{height}')
              print(f'{path}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit exact requested images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/banks/mehriran.png assets/images/banks/refah.png
          git commit -m 'دریافت فایل‌های درخواستی لوگوی بانک‌ها'
          git push origin HEAD:arena/01a0ed0e-kamand
