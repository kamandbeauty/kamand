name: Build Tale Man (طالع من)

on:
  push:
    branches:
      - "arena/0b8c881d-kamand"
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "content/**"
      - "tool/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SQLite (for package:sqlite3 in Dart tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate content (verify it is in sync)
        run: |
          python3 tool/build_content.py
          git diff --exit-code -- lib/data/content/app_content.dart content/app_content.json \
            || (echo "::error::Generated content is out of sync — run python3 tool/build_content.py and commit"; exit 1)

      - name: Resolve dependencies
        run: flutter pub get

      # ── Analyze ────────────────────────────────────────────────────────
      # On failure, the output is re-published as a check run (annotations +
      # summary) so it is readable through the REST API without log download.
      - name: Analyze (errors & warnings fatal; infos tolerated)
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      - name: Publish analyzer output as check run
        if: steps.analyze.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/analyze.log
          TITLE: Analyzer output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if analyzer failed
        if: steps.analyze.outputs.exit != '0'
        run: |
          echo "flutter analyze failed — see the 'Analyzer output' check run on this commit."
          exit 1

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      - name: Publish test output as check run
        if: steps.tests.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/test.log
          TITLE: Test output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if tests failed
        if: steps.tests.outputs.exit != '0'
        run: |
          echo "flutter test failed — see the 'Test output' check run on this commit."
          exit 1

  build-apk:
    name: Build signed APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      # The repository release keystore (set for this repo's CI) is decoded
      # into the runner's temp dir only; it is never committed or stored in
      # artifacts. Local builds fall back to android/key.properties.
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DIVAN_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DIVAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIVAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DIVAN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::notice::Release secrets not found — APK will be debug-signed."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/tale-man-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if ! keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed"; exit 1
          fi
          echo "TALE_MAN_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APKs (per-ABI + universal) + AAB
        id: apk
        continue-on-error: true
        run: |
          set +e
          rc=0
          flutter build apk --release --split-per-abi 2>&1 | tee "$RUNNER_TEMP/apk.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          flutter build apk --release 2>&1 | tee -a "$RUNNER_TEMP/apk.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          flutter build appbundle --release 2>&1 | tee "$RUNNER_TEMP/aab.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish build output as check run
        if: steps.apk.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/apk.log
          TITLE: Release build output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if release build failed
        if: steps.apk.outputs.exit != '0'
        run: |
          echo "flutter build failed — see the 'Release build output' check run on this commit."
          exit 1

      - name: Upload APK artifacts (per-ABI + universal)
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90

      - name: Upload APK artifact (arm32)
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 90

      - name: Upload APK artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-apk-x64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 90

      - name: Upload APK artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Publish/update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apkdir="build/app/outputs/flutter-apk"
          aab="build/app/outputs/bundle/release/app-release.aab"
          tag="tale-man-v1.1.1"

          # Copy artifacts to their final, self-describing filenames.
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dist"; mkdir -p "$dist"
          cp "$apkdir/app-arm64-v8a-release.apk"   "$dist/tale-man-v1.1.1-arm64-v8a.apk"
          cp "$apkdir/app-armeabi-v7a-release.apk" "$dist/tale-man-v1.1.1-armeabi-v7a.apk"
          cp "$apkdir/app-x86_64-release.apk"      "$dist/tale-man-v1.1.1-x86_64.apk"
          cp "$apkdir/app-release.apk"             "$dist/tale-man-v1.1.1-universal.apk"
          cp "$aab"                                 "$dist/tale-man-v1.1.1.aab"

          # Integrity manifest: exact size + SHA-256 of every file, so a
          # corrupted/truncated download can be detected before installing.
          (
            cd "$dist"
            for f in tale-man-v1.1.1-*; do
              printf "%s  %s bytes  sha256:%s\n" "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d" " -f1)"
            done
          ) > "$dist/CHECKSUMS.txt"

          notes="نسخهٔ ۱.۱.۱ «طالع من» — امضای تقویت‌شده (v1+v2+v3) و رفع مشکل نصب.

          کدام فایل را دانلود کنم؟ نسخهٔ مخصوص گوشیِ خودت:

          | فایل | مخصوص |
          |---|---|
          | tale-man-v1.1.1-arm64-v8a.apk | گوشی‌های مدرن (اکثر گوشی‌ها) |
          | tale-man-v1.1.1-armeabi-v7a.apk | گوشی‌های قدیمی‌تر ۳۲ بیتی |
          | tale-man-v1.1.1-x86_64.apk | شبیه‌ساز اندروید |
          | tale-man-v1.1.1-universal.apk | همهٔ گوشی‌ها (حجم بیشتر) |
          | tale-man-v1.1.1.aab | فقط Google Play — نصب مستقیم ندارد |

          اگر نصب نشد («بسته دارای مشکل است» / «برنامه نصب نشد»):
          ۱. اگر برنامهٔ قدیمی «فاکتور روبی» یا «طالع من» روی گوشی نصب است، اول کاملاً حذفش کن (نام پکیج یکی است و امضای متفاوت مانع نصب می‌شود).
          ۲. فایل را دوباره دانلود کن و حجمش را با CHECKSUMS.txt مقایسه کن — اگر کمتر بود، دانلود ناقص است.
          ۳. از برنامهٔ «فایل‌ها» روی فایل apk بزن (نه از داخل مرورگر) و اجازهٔ «نصب از منابع ناشناس» را همان‌جا بده.
          ۴. اگر Play Protect هشدار داد: «جزئیات بیشتر» ← «نصب در هر صورت».
          ۵. فایل aab را نصب نکن — فقط apk نصب می‌شود."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for old_asset in $(gh release view "$tag" --json assets --jq ".assets[].name"); do
              gh release delete-asset "$tag" "$old_asset" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            done
            gh release upload "$tag" "$dist"/* --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$dist"/* \
              --title "طالع من — نسخهٔ ۱.۱.۱" \
              --notes "$notes" \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
