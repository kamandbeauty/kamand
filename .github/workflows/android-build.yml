name: Nameology Android Quality

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
      - name: Publish analyze diagnostics
        if: always()
        run: |
          if [ -f analyze.log ]; then
            message=$(cat analyze.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Flutter Analyze::$message"
          fi
      - name: Fail if analyze failed
        if: steps.analyze.outcome == 'failure'
        run: exit 1
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
      - name: Publish test diagnostics
        if: always()
        run: |
          if [ -f test.log ]; then
            message=$(cat test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Flutter Test::$message"
          fi
      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Publish build diagnostics
        if: always()
        run: |
          if [ -f build.log ]; then
            message=$(cat build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Flutter Build::$message"
          fi
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
