name: Build Tale Man (طالع من)

on:
  push:
    branches:
      - "arena/0b8c881d-kamand"
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "content/**"
      - "tool/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SQLite (for package:sqlite3 in Dart tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate content (verify it is in sync)
        run: |
          python3 tool/build_content.py
          git diff --exit-code -- lib/data/content/app_content.dart content/app_content.json web_preview/src/content/appContent.json \
            || (echo "::error::Generated content is out of sync — run python3 tool/build_content.py and commit"; exit 1)

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (errors & warnings fatal; infos tolerated)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  build-apk:
    name: Build signed APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      # The repository release keystore (set for this repo's CI) is decoded
      # into the runner's temp dir only; it is never committed or stored in
      # artifacts. Local builds fall back to android/key.properties.
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DIVAN_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DIVAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIVAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DIVAN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::notice::Release secrets not found — APK will be debug-signed."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/tale-man-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if ! keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed"; exit 1
          fi
          echo "TALE_MAN_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TALE_MAN_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tale-man-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish/update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          tag="tale-man-v1.0.0"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#tale-man-v1.0.0.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk#tale-man-v1.0.0.apk" \
              --title "طالع من — نسخهٔ ۱.۰.۰" \
              --notes "نسخهٔ اندرویدی «طالع من» — APK امضاشده. برای نصب، فایل را دانلود و اجرا کنید (اجازهٔ نصب از منابع ناشناس لازم است)." \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
