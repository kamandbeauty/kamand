name: Android Debug CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload analyzer report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dart-analyzer-report
          path: analyze.log
          retention-days: 1

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RubiFactor-v1.0.8-vc8-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
