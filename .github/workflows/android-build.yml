name: Build Shelem (شلم)

on:
  push:
    branches:
      - "arena/01a101de-kamand"
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # ── Analyze ────────────────────────────────────────────────────────
      # On failure the output is re-published as a check run (annotations +
      # summary) so it is readable through the REST API without log download.
      - name: Analyze (errors & warnings fatal; infos tolerated)
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      - name: Publish analyzer output as check run
        if: steps.analyze.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/analyze.log
          TITLE: Analyzer output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if analyzer failed
        if: steps.analyze.outputs.exit != '0'
        run: |
          echo "flutter analyze failed — see the 'Analyzer output' check run on this commit."
          exit 1

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      - name: Publish test output as check run
        if: steps.tests.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/test.log
          TITLE: Test output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if tests failed
        if: steps.tests.outputs.exit != '0'
        run: |
          echo "flutter test failed — see the 'Test output' check run on this commit."
          exit 1

      # ── تصاویر رابط کاربری (برای بازبینی طراحی) ────────────────────────
      - name: Render UI screenshots and commit them
        id: shots
        continue-on-error: true
        run: |
          set +e
          {
            echo "== flutter test --update-goldens =="
            flutter test --update-goldens test/screenshots_tool.dart 2>&1
            echo "== exit: $? =="
            echo "== files =="
            ls -l test/golden/ 2>&1
            if ls test/golden/*.png >/dev/null 2>&1; then
              mkdir -p docs/ui
              cp test/golden/*.png docs/ui/
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -f docs/ui
              if git diff --cached --quiet; then
                echo "== screenshots unchanged =="
              else
                git commit -m "تصاویر رابط کاربری [skip ci]" 2>&1
                git fetch origin "$GITHUB_REF_NAME" 2>&1
                git rebase "origin/$GITHUB_REF_NAME" 2>&1
                git push origin "HEAD:$GITHUB_REF_NAME" 2>&1
                echo "== push exit: $? =="
              fi
            else
              echo "== no screenshots produced =="
            fi
          } 2>&1 | tee "$RUNNER_TEMP/shots.log"
          exit 0

      - name: Publish screenshot log as check run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/shots.log
          TITLE: Screenshot log
          CONCLUSION: neutral
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test/golden/
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APKs (per-ABI + universal) + AAB
        id: apk
        continue-on-error: true
        run: |
          set +e
          rc=0
          flutter build apk --release --split-per-abi 2>&1 | tee "$RUNNER_TEMP/apk.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          flutter build apk --release 2>&1 | tee -a "$RUNNER_TEMP/apk.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          flutter build appbundle --release 2>&1 | tee -a "$RUNNER_TEMP/apk.log"
          r="${PIPESTATUS[0]}"; [ "$r" -ne 0 ] && rc="$r"
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish build output as check run
        if: steps.apk.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_PATH: ${{ runner.temp }}/apk.log
          TITLE: Release build output
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_check_run.py

      - name: Fail job if release build failed
        if: steps.apk.outputs.exit != '0'
        run: |
          echo "flutter build failed — see the 'Release build output' check run on this commit."
          exit 1

      - name: Upload APK artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: shelem-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90

      - name: Upload APK artifact (arm32)
        uses: actions/upload-artifact@v4
        with:
          name: shelem-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 90

      - name: Upload APK artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: shelem-apk-x64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 90

      - name: Upload APK artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: shelem-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelem-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Publish/update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apkdir="build/app/outputs/flutter-apk"
          aab="build/app/outputs/bundle/release/app-release.aab"
          tag="shelem-v1.4.0"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$apkdir/app-arm64-v8a-release.apk"   "$out/shelem-v1.4.0-arm64-v8a.apk"
          cp "$apkdir/app-armeabi-v7a-release.apk" "$out/shelem-v1.4.0-armeabi-v7a.apk"
          cp "$apkdir/app-x86_64-release.apk"      "$out/shelem-v1.4.0-x86_64.apk"
          cp "$apkdir/app-release.apk"             "$out/shelem-v1.4.0-universal.apk"
          cp "$aab"                                "$out/shelem-v1.4.0.aab"
          notes="بازی «شلم» — نسخهٔ ۱.۴.۰

          بازی کلاسیک ورق ایرانی: چهار نفره (با یارِ هوشمند در برابر دو حریف)
          یا دو نفره، رو در رو با یک حریفِ هوشمند.
          خواندن (حراج)، گلِ وسط، اعلام حکم با اولین برگ، یاسا، شلم و سرشلم،
          چهار سطح سختی، هفت زمین بازی و ذخیرهٔ خودکار.

          تازه در ۱.۴.۰: شش محیطِ تازه و قابلِ انتخاب برای میزِ بازی —
          چای‌خانه، میزِ چوبی، قالیِ قدیمی، قالیِ ابریشم، قالیِ بته‌جقه و
          قالیِ مینیاتور (به‌علاوهٔ پارکت و میزِ ماهوتی). همچنین ذخیرهٔ
          مقاومِ تنظیمات (دیگر با یک مقدارِ نامعتبر همهٔ تنظیمات پاک نمی‌شود)
          و درست شدنِ عنوانِ ستون‌های جدولِ امتیاز در بازیِ دو نفره.

          پیش‌تر در ۱.۳.۰: حالتِ بازیِ دو نفره. هر نفر ۱۲ برگ می‌گیرد، ۴ برگ گلِ
          وسط می‌شود و ۲۴ برگِ باقی‌مانده روی هم می‌ماند؛ بعد از هر دست اول
          برنده و بعد حریف یک برگ برمی‌دارد، پس در مجموع ۲۴ دست و ۲۲۵ امتیاز
          (با جوکر ۲۶۰) بازی می‌شود و حداقلِ خواندن ۱۳۵ است. انتخابِ تعداد
          بازیکنان هم در صفحهٔ اصلی و هم در تنظیمات.

          پیش‌تر در ۱.۲.۱: نقش‌های ورق «دوسر» شدند (مثل پاسورِ واقعی: نیمهٔ
          بالا ایستاده و نیمهٔ پایین وارونه) با نگاره‌های بزرگ‌تر و تمیزتر،
          رفعِ باگِ شروعِ دست با جوکر (تا اعلام نشدنِ حکم هیچ برگی بازی
          نمی‌شود)، حفظِ همان خالی که ربات هنگام چیدنِ دستش برای حکم در نظر
          گرفته، و جلوگیری از شروعِ راندِ تازه پس از پایانِ بازی.

          پیش‌تر در ۱.۲.۰: نگاره‌های تازه و دست‌ساز برای سرباز، بی‌بی، شاه و
          جوکر (طرحِ ایرانی با قلم‌گیریِ تمیز)، میزِ نمدیِ بیضی با قابِ چوبی و
          نشانِ خال‌ها، چیدمانِ استانداردِ نمادها روی ورق‌های عددی، و
          انیمیشن‌های روان. رفعِ باگ‌ها: دکمهٔ «شلم» در نوار حراج دیده می‌شود،
          بالاترین خواننده دیگر نمی‌تواند پاس بدهد، تغییرِ قوانین وسطِ راند
          بازی را خراب نمی‌کند، قلمِ فارسی روی همهٔ دکمه‌ها درست است و هیچ
          خطایی بازی را قفل نمی‌کند. افزونِ بر این، تستِ فازی با بیش از هزار
          راندِ کامل روی همهٔ حالت‌های قانونی اجرا می‌شود.

          کدام فایل را دانلود کنم؟

          | فایل | مخصوص |
          |---|---|
          | arm64-v8a | گوشی‌های مدرن (اکثر گوشی‌های سامسونگ، شیائومی، پیکسل و…) |
          | armeabi-v7a | گوشی‌های قدیمی‌تر ۳۲ بیتی |
          | x86_64 | شبیه‌ساز اندروید روی کامپیوتر |
          | universal | همهٔ گوشی‌ها — فقط حجمش بیشتر است |
          | aab | فقط برای انتشار در Google Play (نصب مستقیم ندارد) |

          برای نصب، فایل apk را دانلود و اجرا کنید (اجازهٔ نصب از منابع ناشناس لازم است)."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for stale in app-release.apk app-release.aab app-arm64-v8a-release.apk \
                         app-armeabi-v7a-release.apk app-x86_64-release.apk; do
              gh release delete-asset "$tag" "$stale" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            done
            gh release upload "$tag" \
              "$out/shelem-v1.4.0-arm64-v8a.apk" \
              "$out/shelem-v1.4.0-armeabi-v7a.apk" \
              "$out/shelem-v1.4.0-x86_64.apk" \
              "$out/shelem-v1.4.0-universal.apk" \
              "$out/shelem-v1.4.0.aab" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              "$out/shelem-v1.4.0-arm64-v8a.apk" \
              "$out/shelem-v1.4.0-armeabi-v7a.apk" \
              "$out/shelem-v1.4.0-x86_64.apk" \
              "$out/shelem-v1.4.0-universal.apk" \
              "$out/shelem-v1.4.0.aab" \
              --title "شلم — نسخهٔ ۱.۴.۰" \
              --notes "$notes" \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
