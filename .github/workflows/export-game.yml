name: Build & Export Lumi Android APK

on:
  push:
    branches:
      - "main"
      - "arena/*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Verification Tests
        run: |
          python3 tests/verify_bubble_core.py
          python3 tests/verify_phase2_suite.py
          python3 tests/verify_phase3_suite.py
          python3 tests/benchmark_stress_test.py

  build-android-apk:
    name: Build & Export Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          fi
          echo "ANDROID_HOME=${SDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> $GITHUB_ENV
          
          if [ -f "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Godot 4.3 Headless & Export Templates
        run: |
          GODOT_VERSION="4.3"
          GODOT_RELEASE="stable"
          
          # Download Godot Linux Headless Binary
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          # Download and unpack Godot Export Templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          
          # Copy templates to all standard Godot template paths
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          cp -r templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          
          mkdir -p ~/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}
          cp -r templates/* ~/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: Generate Android Keystore & Editor Settings
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cp ~/.android/debug.keystore ./debug.keystore
          
          KEYSTORE_PATH="$(pwd)/debug.keystore"
          JAVA_PATH="${JAVA_HOME}"
          SDK_PATH="${ANDROID_HOME}"
          
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/debug_keystore = "${KEYSTORE_PATH}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "${JAVA_PATH}"
          export/android/force_system_user = false
          EOF

      - name: Export Android APK
        run: |
          mkdir -p builds/android
          godot --headless -v --export-debug "Android" builds/android/lumi-bubblewood.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Android-APK
          path: builds/android/lumi-bubblewood.apk
          if-no-files-found: error
