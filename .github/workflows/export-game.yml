name: Build & Export Lumi Android APK

on:
  push:
    branches:
      - "main"
      - "arena/*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Verification Tests
        run: |
          python3 tests/verify_bubble_core.py
          python3 tests/verify_phase2_suite.py
          python3 tests/verify_phase3_suite.py
          python3 tests/benchmark_stress_test.py

  build-android-apk:
    name: Build & Export Android APK
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Keystore & Settings
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cp ~/.android/debug.keystore ./debug.keystore

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Export Android APK
        run: |
          mkdir -p builds/android
          godot -v --headless --export-debug "Android" builds/android/lumi-bubblewood.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Android-APK
          path: builds/android/lumi-bubblewood.apk
          if-no-files-found: error
