# ساخت خودکار اپلیکیشن «دیوان و فال حافظ» روی GitHub Actions
# خروجی: ۴ فایل APK — universal (همهٔ گوشی‌ها) + اختصاصی هر معماری
# (arm64-v8a گوشی‌های امروزی، armeabi-v7a قدیمی ۳۲بیتی، x86_64 شبیه‌ساز/تبلت)
name: Build Divan & Fal Hafez App

on:
  push:
    branches: [arena/01a10170-kamand, main]
    paths:
      - 'divan_fal_hafez/**'
      - '.github/workflows/build-fal-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # بیلدِ قابل‌تکرار: pub get بر اساس pubspec.lock کامیت‌شده.
      # گذار: اگر lockfile فعلی با SDK جدید ناسازگار بود، یک‌بار upgrade
      # انجام و lock تازه به‌عنوان artifact منتشر می‌شود تا کامیت شود.
      - name: Resolve dependencies (pub get)
        working-directory: divan_fal_hafez
        run: flutter pub get || flutter pub upgrade

      - name: Upload resolved pubspec.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: divan_fal_hafez/pubspec.lock
          retention-days: 7

      - name: Analyze
        working-directory: divan_fal_hafez
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze-report.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> analyze-report.txt
          exit $code

      - name: Upload analyze report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-report
          path: divan_fal_hafez/analyze-report.txt
          retention-days: 30

      - name: Post analyze failure report to PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: divan_fal_hafez
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --json number -q '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ] && [ -f analyze-report.txt ]; then
            {
              echo "### ❌ گزارش خطای آنالیز (run #${GITHUB_RUN_NUMBER})"
              echo '```text'
              tail -c 6000 analyze-report.txt
              echo '```'
            } > /tmp/comment-analyze.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment-analyze.md
          fi

      - name: Run tests
        working-directory: divan_fal_hafez
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > test-report.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> test-report.txt
          exit $code

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: divan_fal_hafez/test-report.txt
          retention-days: 30

      - name: Post failure report to PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: divan_fal_hafez
        shell: bash
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --json number -q '.[0].number')
          echo "PR=$PR"
          if [ -n "$PR" ] && [ "$PR" != "null" ] && [ -f test-report.txt ]; then
            {
              echo "### ❌ گزارش خطای تست (run #${GITHUB_RUN_NUMBER})"
              echo '```text'
              grep -v "═\|─" test-report.txt | tail -c 9000
              echo '```'
            } > /tmp/comment.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          fi

  build-apk:
    name: Build APKs (universal + per-ABI)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve dependencies (pub get)
        working-directory: divan_fal_hafez
        run: flutter pub get || flutter pub upgrade

      - name: Build release APKs (universal + split per ABI)
        working-directory: divan_fal_hafez
        shell: bash
        run: |
          set +e
          flutter build apk --release --split-per-abi > apk-build-report.txt 2>&1 \
            && flutter build apk --release >> apk-build-report.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> apk-build-report.txt
          exit $code

      - name: Post APK build failure report to PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: divan_fal_hafez
        shell: bash
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --json number -q '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            {
              echo "### ❌ گزارش خطای ساخت APK (run #${GITHUB_RUN_NUMBER})"
              echo '```text'
              grep -v "═\|─" apk-build-report.txt | tail -c 9000
              echo '```'
            } > /tmp/comment-apk.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment-apk.md
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divan-hafez-apk
          path: |
            divan_fal_hafez/build/app/outputs/flutter-apk/app-release.apk
            divan_fal_hafez/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            divan_fal_hafez/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            divan_fal_hafez/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 90

  release:
    name: Publish GitHub Release (Android APKs)
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: divan-hafez-apk
          path: apk

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version:' divan_fal_hafez/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION"
          [ "$TAG" = "v" ] && echo "version not found" && exit 1
          mkdir -p out
          cp apk/app-release.apk "out/divan-fal-hafez-${TAG}-universal.apk"
          cp apk/app-arm64-v8a-release.apk "out/divan-fal-hafez-${TAG}-arm64-v8a.apk"
          cp apk/app-armeabi-v7a-release.apk "out/divan-fal-hafez-${TAG}-armeabi-v7a.apk"
          cp apk/app-x86_64-release.apk "out/divan-fal-hafez-${TAG}-x86_64.apk"
          NOTES="نسخهٔ ${VERSION} — فایل‌های نصبی اندروید (ساخت خودکار CI از شاخه ${GITHUB_REF_NAME}, کامیت ${GITHUB_SHA}):
          - **universal**: برای همهٔ گوشی‌ها (اگر مطمئن نیستید همین را نصب کنید)
          - **arm64-v8a**: بیشتر گوشی‌های امروزی (کم‌حجم‌تر)
          - **armeabi-v7a**: گوشی‌های قدیمی ۳۲بیتی
          - **x86_64**: شبیه‌ساز و برخی تبلت‌ها"
          # هر تگ فقط یک‌بار ساخته می‌شود تا APK همیشه دقیقاً با کامیتِ
          # تگ هم‌خوان بماند؛ بازنویسی ریلیز موجود (--clobber) حذف شد.
          # برای انتشار تغییرات باید version در pubspec.yaml افزایش یابد.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            {
              echo "## ⚠️ ریلیز \`${TAG}\` از قبل وجود دارد — انتشار جدید انجام نشد"
              echo ""
              echo 'برای انتشار نسخهٔ جدید، مقدار `version` در `divan_fal_hafez/pubspec.yaml` را افزایش دهید (مثلاً 1.5.3+14).'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Release $TAG already exists; skipping publish (bump version to release)."
            exit 0
          fi
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "دیوان و فال حافظ ${VERSION}" --notes "$NOTES"
