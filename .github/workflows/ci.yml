name: CI (analyze + tests + debug APK)

on:
  push:
    branches:
      - arena/01a0c079-kamand
      - arena/01a0bed4-kamand
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # پیام‌های تحلیلگر به‌صورت annotation ثبت می‌شوند تا از API گیت‌هاب
      # قابل خواندن باشند (لاگ خام در بعضی شبکه‌ها در دسترس نیست).
      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > analyze-output.txt 2>&1
          status=$?
          cat analyze-output.txt

          # خطاها و هشدارها بیلد را متوقف می‌کنند؛ «info»ها (مثل هشدارهای
          # deprecation مربوط به نسخه‌ی تازه‌ی Flutter) نه.
          if grep -qE "^[[:space:]]+(error|warning) •" analyze-output.txt; then
            while IFS= read -r line; do
              case "$line" in
                *" error • "*|*" warning • "*) echo "::error title=analyze::${line//$'\r'/}" ;;
              esac
            done < analyze-output.txt
            exit 1
          fi

          if [ "$status" -ne 0 ] && ! grep -qE "info •|issues? found|No issues" analyze-output.txt; then
            echo "::error title=analyze::flutter analyze failed without a diagnostics report"
            exit 1
          fi
          exit 0

      # تست‌های مهاجرت داده: تضمین می‌کنند به‌روزرسانی نسخه‌ی نصب‌شده چیزی از
      # اطلاعات کاربر را از دست ندهد و مبلغ‌ها دو بار حساب نشوند.
      - name: Run tests
        shell: bash
        run: |
          set +e
          flutter test --no-pub > test-output.txt 2>&1
          status=$?
          cat test-output.txt

          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"[E]"*|*"Some tests failed"*|*"failed to load"*|*"Error:"*) echo "::error title=test::${line//$'\r'/}" ;;
              esac
            done < test-output.txt
            exit 1
          fi
          exit 0

  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${version##*+}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug

      # تضمین اینکه خروجی همان برنامه‌ی روبی است و شماره‌ی نسخه‌اش با
      # pubspec یکی است (پیش‌شرط به‌روزرسانی بدون حذف نصب).
      - name: Verify upgrade safety of the built APK
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x scripts/verify_upgrade_safety.sh
          scripts/verify_upgrade_safety.sh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RubiFactor-debug-v${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
