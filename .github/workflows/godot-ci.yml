name: Godot CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"

jobs:
  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.5.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_DIR"

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          echo "Downloading Godot ${GODOT_VERSION}-${GODOT_RELEASE}"

          curl \
            --fail \
            --location \
            --retry 3 \
            "$DOWNLOAD_URL" \
            --output /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$GODOT_DIR"

          echo "Extracted files:"
          ls -la "$GODOT_DIR"

          GODOT_BINARY=$(find "$GODOT_DIR" \
            -maxdepth 1 \
            -type f \
            -name 'Godot_v*_linux.x86_64' \
            | head -n 1)

          if [ -z "$GODOT_BINARY" ]; then
            echo "::error::Godot binary was not found after extraction"
            exit 1
          fi

          mv "$GODOT_BINARY" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Check Godot version
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_DIR/godot" --version

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "project.godot"
            "scenes/main/Main.tscn"
            "resources/levels/Level1.tres"
            "resources/levels/LevelData.gd"
            "scripts/main.gd"
            "scripts/player/Player.gd"
            "scripts/player/SoldierFormation.gd"
            "scripts/enemy/Enemy.gd"
            "scripts/enemy/EnemyManager.gd"
            "scripts/systems/Projectile.gd"
            "assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
            "assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Validate asset files
        shell: bash
        run: |
          set -euo pipefail

          SOLDIER_ASSET="assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
          ENEMY_ASSET="assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"

          if [ ! -f "$SOLDIER_ASSET" ]; then
            echo "::error file=$SOLDIER_ASSET::Soldier GLTF asset not found"
            exit 1
          fi

          if [ ! -f "$ENEMY_ASSET" ]; then
            echo "::error file=$ENEMY_ASSET::Enemy GLTF asset not found"
            exit 1
          fi

          echo "Soldier asset exists: $SOLDIER_ASSET"
          echo "Enemy asset exists: $ENEMY_ASSET"
          echo "Asset validation passed."

      - name: Parse and validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_DIR/godot" \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose

      - name: Load Level 1 resource
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_DIR/godot" \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose

          echo "Level1.tres validation completed through project import."

      - name: Run logic tests
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_DIR/godot" \
            --headless \
            --path . \
            --script res://tests/test_game_logic.gd

      - name: Run Main Scene smoke test
        shell: bash
        run: |
          set -euo pipefail

          timeout \
            --signal=TERM \
            --kill-after=5s \
            20s \
            "$GODOT_DIR/godot" \
              --headless \
              --path . \
              --quit-after 5
