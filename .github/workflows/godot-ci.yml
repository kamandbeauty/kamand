name: Godot CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"
  CI_PROJECT: "/tmp/godot-ci-project"

jobs:
  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.5.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_DIR"

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "$DOWNLOAD_URL" \
            --output /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$GODOT_DIR"

          GODOT_BINARY=$(find "$GODOT_DIR" \
            -maxdepth 1 \
            -type f \
            -name 'Godot_v*_linux.x86_64' \
            | head -n 1)

          if [ -z "$GODOT_BINARY" ]; then
            echo "::error::Godot binary was not found after extraction"
            ls -la "$GODOT_DIR"
            exit 1
          fi

          mv "$GODOT_BINARY" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Check Godot version
        run: |
          set -euo pipefail
          timeout 30s "$GODOT_DIR/godot" --version

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "project.godot"
            "scenes/main/Main.tscn"
            "resources/levels/Level1.tres"
            "resources/levels/LevelData.gd"
            "scripts/main.gd"
            "scripts/player/Player.gd"
            "scripts/player/SoldierFormation.gd"
            "scripts/enemy/Enemy.gd"
            "scripts/enemy/EnemyManager.gd"
            "scripts/systems/Projectile.gd"
            "tests/test_game_logic.gd"
            "assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf"
            "assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file not found"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Validate asset files
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf

          test -f \
            assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf

          echo "Required GLTF assets exist."

      - name: Create minimal CI project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$CI_PROJECT"

          mkdir -p \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters"

          rsync -a \
            --exclude=".git" \
            --exclude=".godot" \
            --exclude="assets" \
            ./ \
            "$CI_PROJECT/"

          cp \
            assets/toon_shooter_game_kit/Characters/Character_Soldier.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters/"

          cp \
            assets/toon_shooter_game_kit/Characters/Character_Enemy.gltf \
            "$CI_PROJECT/assets/toon_shooter_game_kit/Characters/"

      - name: Parse and validate Godot project
        shell: bash
        run: |
          set -o pipefail

          timeout \
            --signal=TERM \
            --kill-after=5s \
            90s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --editor \
              --quit \
              --verbose \
              2>&1 | tee /tmp/godot-parse.log

      - name: Run logic tests
        shell: bash
        run: |
          set -o pipefail

          timeout 60s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --script res://tests/test_game_logic.gd \
              2>&1 | tee /tmp/godot-tests.log

      - name: Run Main Scene smoke test
        shell: bash
        run: |
          set -o pipefail

          timeout \
            --signal=TERM \
            --kill-after=5s \
            45s \
            "$GODOT_DIR/godot" \
              --headless \
              --path "$CI_PROJECT" \
              --quit-after 5 \
              2>&1 | tee /tmp/godot-runtime.log
