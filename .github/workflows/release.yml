name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and verify signed APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${RELEASE_KEYSTORE_BASE64:-}" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "${RELEASE_STORE_PASSWORD:-}" ]] || missing+=(RELEASE_STORE_PASSWORD)
          [[ -n "${RELEASE_KEY_ALIAS:-}" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "${RELEASE_KEY_PASSWORD:-}" ]] || missing+=(RELEASE_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Gradle Wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Restore release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/rubi-release.jks"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi

          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"

          if [[ "$version" != *+* ]]; then
            echo "::error::pubspec.yaml version must use name+code format."
            exit 1
          fi

          version_name="${version%%+*}"
          version_code="${version##*+}"

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building version $version_name (versionCode $version_code)."

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Build signed release AAB
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Name release artifacts
        id: artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob

          apk_files=(build/app/outputs/flutter-apk/app-*-release.apk)
          aab="build/app/outputs/bundle/release/app-release.aab"

          [[ ${#apk_files[@]} -gt 0 ]] || {
            echo "::error::No split release APK was generated."
            exit 1
          }

          [[ -f "$aab" ]] || {
            echo "::error::Release AAB was not generated."
            exit 1
          }

          arm64_artifact=""

          for apk in "${apk_files[@]}"; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"

            artifact="release-artifacts/RubiFactor-v${VERSION_NAME}-vc${VERSION_CODE}-${abi}-release.apk"
            cp "$apk" "$artifact"

            if [[ "$abi" == "arm64-v8a" ]]; then
              arm64_artifact="$artifact"
            fi
          done

          [[ -n "$arm64_artifact" ]] || {
            echo "::error::arm64-v8a APK was not generated."
            exit 1
          }

          cp "$aab" \
            "release-artifacts/RubiFactor-v${VERSION_NAME}-vc${VERSION_CODE}-release.aab"

          echo "arm64_path=$arm64_artifact" >> "$GITHUB_OUTPUT"

      - name: Verify APK and AAB signatures
        env:
          APK_DIR: build/app/outputs/flutter-apk
          PRIMARY_APK_PATH: ${{ steps.artifacts.outputs.arm64_path }}
          AAB_PATH: build/app/outputs/bundle/release/app-release.aab
          EXPECTED_APPLICATION_ID: com.ruby.factor_ruby
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          apksigner_bin="$(command -v apksigner || true)"

          if [[ -z "$apksigner_bin" && -n "$sdk_root" ]]; then
            apksigner_bin="$(
              find "$sdk_root" -type f -name apksigner \
                -print 2>/dev/null | sort -V | tail -n 1
            )"
          fi

          if [[ -z "$apksigner_bin" ]]; then
            echo "::error::apksigner is not available on the runner."
            exit 1
          fi

          shopt -s nullglob
          apk_files=("$APK_DIR"/app-*-release.apk)

          [[ ${#apk_files[@]} -gt 0 ]] || {
            echo "::error::No APK found for verification."
            exit 1
          }

          for apk in "${apk_files[@]}"; do
            "$apksigner_bin" verify --verbose "$apk"
          done

          if ! unzip -l "$AAB_PATH" \
            | grep -Eiq 'META-INF/[^ ]+\.(RSA|DSA|EC)'; then
            echo "::error::The AAB does not contain a signing certificate entry."
            exit 1
          fi

          jarsigner -verify -verbose -certs "$AAB_PATH" \
            > "$RUNNER_TEMP/aab-signature.txt" 2>&1

          grep -q "jar verified" "$RUNNER_TEMP/aab-signature.txt"
          echo "AAB signature verification passed."

          apkanalyzer_bin="$(command -v apkanalyzer || true)"

          if [[ -z "$apkanalyzer_bin" && -n "$sdk_root" ]]; then
            apkanalyzer_bin="$(
              find "$sdk_root" -type f -name apkanalyzer \
                -print 2>/dev/null | sort -V | tail -n 1
            )"
          fi

          if [[ -n "$apkanalyzer_bin" ]]; then
            [[ "$("$apkanalyzer_bin" manifest application-id "$PRIMARY_APK_PATH")" \
              == "$EXPECTED_APPLICATION_ID" ]]

            [[ "$("$apkanalyzer_bin" manifest version-name "$PRIMARY_APK_PATH")" \
              == "$EXPECTED_VERSION_NAME" ]]

            [[ "$("$apkanalyzer_bin" manifest version-code "$PRIMARY_APK_PATH")" \
              == "$EXPECTED_VERSION_CODE" ]]

            if "$apkanalyzer_bin" manifest print "$PRIMARY_APK_PATH" \
              | grep -q 'android:debuggable="true"'; then
              echo "::error::The release APK is debuggable."
              exit 1
            fi

            echo "APK applicationId, version and debuggable flag verified."
          else
            echo "::warning::apkanalyzer is not available; metadata checks were skipped."
          fi

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RubiFactor-release-v${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*

      - name: Remove temporary keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        shell: bash
        run: |
          rm -f -- "${KEYSTORE_PATH:-$RUNNER_TEMP/rubi-release.jks}"
