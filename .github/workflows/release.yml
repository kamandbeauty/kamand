name: Nameology Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build pre-release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee release-build.log

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log

      - name: Publish release build diagnostics
        if: always()
        run: |
          if [ -f release-build.log ]; then
            message=$(tail -c 60000 release-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Flutter Release Build::$message"
          fi

      - name: Fail if release build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: build/app/outputs/flutter-apk/app-release.apk
