name: ROOZI Android

on:
  push:
    branches:
      - "arena/01a002a3-kamand"
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roozi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build ROOZI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: roozi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Decode the upload keystore from repository secrets. Without them the
      # build still succeeds and falls back to the debug key, so pull requests
      # from forks (which cannot read secrets) keep working — but a debug-signed
      # APK cannot be published to Cafe Bazaar or Myket, hence the loud notice.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROZI_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROZI_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROZI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROZI_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets present - release will use the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail fast and by name: a keystore with a missing password produces a
          # confusing Gradle error much later in the build.
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::ROZI_RELEASE_${v} is empty; all four signing secrets are required."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          if ! keytool -list -keystore release.keystore \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore did not open. Check that the base64 is intact and that the password and alias match."
            exit 1
          fi

          # storeFile is resolved against the roozi/ root by build.gradle.kts.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore verified."

      # Build in stages so a failure points at the exact phase.
      - name: Compile app sources
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Compile unit test sources
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugUnitTestKotlin --stacktrace 2>&1 | tee -a /tmp/gradle.log

      # Real correctness checks — these SHOULD block the build.
      # Covers the Jalali calendar, recurrence rules and the streak logic.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/gradle.log

      # Compiler/test errors are echoed as annotations so they are readable
      # through the API even when raw log download is unavailable.
      - name: Report failure details
        if: failure()
        run: |
          echo "### Build failure" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |^w: .*error|error:|FAILURE:|FAILED|Caused by:|Execution failed|expected:|actual:|AssertionError" /tmp/gradle.log \
            | grep -v "Deprecated Gradle features" | head -60 | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/errs.txt || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          n=0
          while IFS= read -r line && [ $n -lt 25 ]; do
            clean=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/ /g')
            echo "::error::${clean}"
            n=$((n+1))
          done < /tmp/errs.txt

      # Lint is advisory: a style warning must never stop you getting an APK.
      - name: Android Lint (advisory)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      # Proves the artifact is genuinely release-signed rather than assuming it.
      - name: Verify APK signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is debug-signed despite the signing secrets being present."
            exit 1
          fi
          echo "APK is signed with the upload certificate."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roozi-release-apk
          path: roozi/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: roozi-release-aab
          path: roozi/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roozi-reports
          path: |
            roozi/app/build/reports/**
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Summary
        if: always()
        run: |
          {
            echo "### ROOZI build"
            echo ""
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then
              size=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
              echo "APK built successfully (size: $size)"
            elif ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
              echo "APK built successfully"
            else
              echo "No APK produced — check the logs above."
            fi
            echo ""
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "Signed with the release keystore - ready to publish."
            else
              echo "Debug-signed: installable for testing, not publishable."
            fi
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
