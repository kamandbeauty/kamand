name: Debug Arena Build

on:
  push:
    branches:
      - arena/01a0bed4-kamand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
          echo "analyze exit ${PIPESTATUS[0]}" | tee -a analyze.log
          cat analyze.log
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log
          echo "build exit ${PIPESTATUS[0]}" | tee -a build.log
          # Always show last 500 lines
          echo "--- LAST 500 LINES OF BUILD LOG ---"
          tail -n 500 build.log
      - name: Show build failure details
        if: failure() || steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED - FULL LOG TAIL ==="
          tail -n 1000 build.log || true
          echo "=== ANALYZE LOG ==="
          cat analyze.log || true
          # Try to find Dart errors
          grep -i -E "error|exception|failed" build.log | tail -n 200 || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Show logs inline
        if: always()
        run: |
          echo "=== ANALYZE LOG ==="
          cat analyze.log || true
          echo ""
          echo "=== BUILD LOG LAST 1000 LINES ==="
          tail -n 1000 build.log || true
          echo ""
          echo "=== BUILD LOG GREP ERRORS ==="
          grep -i -A2 -B2 "error\|FAILURE\|Exception" build.log | tail -n 500 || true
      - name: Save logs to repo for sandbox retrieval
        if: always()
        run: |
          set -x
          mkdir -p /tmp/logs
          cp -v analyze.log /tmp/logs/ 2>&1 || true
          cp -v build.log /tmp/logs/ 2>&1 || true
          # Create a file with error summary that we can commit
          echo "# Build Log for run ${{ github.run_id }}" > build_failure.md
          echo "" >> build_failure.md
          echo "## Analyze" >> build_failure.md
          cat analyze.log >> build_failure.md 2>&1 || true
          echo "" >> build_failure.md
          echo "## Build last 2000 lines" >> build_failure.md
          tail -n 2000 build.log >> build_failure.md 2>&1 || true
          echo "" >> build_failure.md
          echo "## Errors" >> build_failure.md
          grep -i -E "error|failure|exception" build.log | tail -n 300 >> build_failure.md 2>&1 || true
          # Commit to logs branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin arena/logs-debug || true
          git checkout -B arena/logs-debug
          cp -v /tmp/logs/analyze.log ./analyze.log 2>&1 || true
          cp -v /tmp/logs/build.log ./build.log 2>&1 || true
          cp -v build_failure.md ./build_failure.md 2>&1 || true
          git add -f analyze.log build.log build_failure.md 2>&1 || true
          git status 2>&1 || true
          git commit -m "ci: logs for run ${{ github.run_id }}" 2>&1 || true
          git push origin arena/logs-debug --force 2>&1 || true
      - name: Comment PR with failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find PR for this branch
          PR_NUM=$(gh pr list --head arena/01a0bed4-kamand --json number --jq '.[0].number' 2>&1 || echo "18")
          echo "PR is $PR_NUM"
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            tail -n 500 build.log > /tmp/tail.log 2>&1 || true
            gh pr comment $PR_NUM --body-file /tmp/tail.log 2>&1 || true
            gh pr comment $PR_NUM --body "Build failed for run ${{ github.run_id }}. See arena/logs-debug branch for full logs." 2>&1 || true
          fi
