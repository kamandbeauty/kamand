name: Debug Arena Build

on:
  push:
    branches:
      - arena/01a0bed4-kamand
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
          echo "analyze exit ${PIPESTATUS[0]}" | tee -a analyze.log
          cat analyze.log
      - name: Build debug APK
        id: build
        run: |
          set -e
          echo "PWD $(pwd)"
          ls -lh
          touch build.log
          echo "Starting build at $(date)" | tee build.log
          echo "Running flutter build..."
          # Run without pipefail to always capture log
          flutter build apk --debug --verbose 2>&1 | tee -a build.log || echo "FLUTTER BUILD FAILED WITH $?" | tee -a build.log
          echo "Build step finished, log size:"
          ls -lh build.log
          echo "Last 500 lines:"
          tail -n 500 build.log || true
          # Ensure we exit 0 to allow next steps to see log, but mark outcome
          exit 0
      - name: Show build failure details
        if: failure() || steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED - FULL LOG TAIL ==="
          tail -n 1000 build.log || true
          echo "=== ANALYZE LOG ==="
          cat analyze.log || true
          # Try to find Dart errors
          grep -i -E "error|exception|failed" build.log | tail -n 200 || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Show logs inline
        if: always()
        run: |
          echo "=== ANALYZE LOG ==="
          cat analyze.log || true
          echo ""
          echo "=== BUILD LOG LAST 1000 LINES ==="
          tail -n 1000 build.log || true
          echo ""
          echo "=== BUILD LOG GREP ERRORS ==="
          grep -i -A2 -B2 "error\|FAILURE\|Exception" build.log | tail -n 500 || true
      - name: Save logs to repo for sandbox retrieval
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "=== LS ===" 
          ls -lh || true
          ls -lh *.log || true
          echo "=== PWD ==="
          pwd
          # Create a file with error summary that we can commit
          echo "# Build Log for run ${{ github.run_id }}" > build_failure.md
          echo "" >> build_failure.md
          echo "## Analyze" >> build_failure.md
          cat analyze.log >> build_failure.md 2>&1 || echo "no analyze.log" >> build_failure.md
          echo "" >> build_failure.md
          echo "## LS" >> build_failure.md
          ls -lh >> build_failure.md 2>&1 || true
          echo "" >> build_failure.md
          echo "## Build log exists?" >> build_failure.md
          ls -lh build.log >> build_failure.md 2>&1 || echo "build.log not found" >> build_failure.md
          echo "" >> build_failure.md
          echo "## Build last 2000 lines" >> build_failure.md
          tail -n 2000 build.log >> build_failure.md 2>&1 || echo "cannot tail build.log" >> build_failure.md
          echo "" >> build_failure.md
          echo "## Errors" >> build_failure.md
          grep -i -E "error|failure|exception" build.log | tail -n 500 >> build_failure.md 2>&1 || echo "no errors grep" >> build_failure.md
          cat build_failure.md
          # Also try to create GitHub issue with logs via API (visible in sandbox via gh issue list)
          echo "Creating issue with logs..."
          gh issue create --title "Build log for run ${{ github.run_id }}" --body-file build_failure.md 2>&1 || true
          echo "--- trying to comment PR with logs ---"
          PR_NUM=$(gh pr list --head arena/01a0bed4-kamand --json number --jq '.[0].number' 2>&1 || echo "")
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ] && [ "$PR_NUM" != "" ]; then
            gh pr comment $PR_NUM --body-file build_failure.md 2>&1 || true
          fi
      - name: Comment PR with failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --head arena/01a0bed4-kamand --json number --jq '.[0].number' 2>&1 || echo "18")
          echo "PR is $PR_NUM"
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            echo "Build failed, see issues for logs" > /tmp/comment.txt
            tail -n 200 build.log >> /tmp/comment.txt 2>&1 || true
            gh pr comment $PR_NUM --body-file /tmp/comment.txt 2>&1 || true
          fi
