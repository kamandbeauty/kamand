name: Debug Arena Build

on:
  push:
    branches:
      - arena/01a0bed4-kamand
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub 2>&1 | tee analyze.log; echo "analyze exit ${PIPESTATUS[0]}" | tee -a analyze.log
      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log
          echo "build exit ${PIPESTATUS[0]}" | tee -a build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
