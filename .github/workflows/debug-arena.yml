name: Debug Arena Build

on:
  push:
    branches:
      - arena/01a0bed4-kamand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
          echo "analyze exit ${PIPESTATUS[0]}" | tee -a analyze.log
          cat analyze.log
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log
          echo "build exit ${PIPESTATUS[0]}" | tee -a build.log
          # Always show last 500 lines
          echo "--- LAST 500 LINES OF BUILD LOG ---"
          tail -n 500 build.log
      - name: Show build failure details
        if: failure() || steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED - FULL LOG TAIL ==="
          tail -n 1000 build.log || true
          echo "=== ANALYZE LOG ==="
          cat analyze.log || true
          # Try to find Dart errors
          grep -i -E "error|exception|failed" build.log | tail -n 200 || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Commit logs to branch for debugging
        if: always()
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pwd
          ls -lh *.log || true
          mkdir -p /tmp/logs
          cp -v analyze.log /tmp/logs/ || true
          cp -v build.log /tmp/logs/ || true
          ls -lh /tmp/logs/
          # Checkout a new branch for logs
          git checkout -B arena/logs-debug
          cp -v /tmp/logs/analyze.log ./analyze.log || true
          cp -v /tmp/logs/build.log ./build.log || true
          ls -lh *.log || true
          git add -f analyze.log build.log || true
          git status || true
          git commit -m "ci: add build logs from failed run ${{ github.run_id }}" || true
          git push origin arena/logs-debug --force
          echo "pushed logs branch"
