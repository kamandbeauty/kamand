name: Debug Arena Build

on:
  push:
    branches:
      - arena/01a0bed4-kamand
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze.log
          cat analyze.log
          if grep -q " error •" analyze.log; then
            echo "::error::Flutter analyze found errors"
            exit 1
          fi
      - name: Build debug APK
        id: build
        run: |
          flutter build apk --debug --verbose 2>&1 | tee build.log
          tail -n 100 build.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "# Build Failed for run ${{ github.run_id }}\n\n";
            try {
              const analyze = fs.readFileSync('analyze.log', 'utf8');
              body += "## Analyze\n```\n" + analyze.slice(-8000) + "\n```\n\n";
            } catch(e) {}
            try {
              const build = fs.readFileSync('build.log', 'utf8');
              body += "## Build log tail\n```\n" + build.slice(-8000) + "\n```\n";
            } catch(e) { body += "No build.log found: " + e; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed for run ${{ github.run_id }}`,
              body: body
            });
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-logs
          path: |
            analyze.log
            build.log
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
