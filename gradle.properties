org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 (the default with KSP 2.0.x / Kotlin 2.0) has a known value-class
# bug that breaks Room: KSP2's KType for a value class does not match the
# @TypeConverter signature, so Room falls back to its default type adapter
# and crashes in getValueClassUnderlyingProperty with
# "List has more than one element". KSP1 resolves value-class KTypes
# correctly, so force KSP1 while Money stays a value class.
ksp.useKSP2=false
