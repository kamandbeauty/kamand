# حافظه: روی GitHub Actions هر runner حدود ۷ گیگ رم دارد؛ ۳ گیگ برای
# Gradle امن است و فضا برای Kotlin/KSP daemon باقی می‌گذارد.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache با ترکیب AGP 8.5 + Hilt + KSP ناپایدار است و باعث
# شکست در مرحله «Calculating task graph» می‌شود. تا پایدار شدن، خاموش است.
org.gradle.configuration-cache=false

# Kotlin daemon نیز باید سقف حافظه داشته باشد وگرنه روی CI با OOM متوقف می‌شود
kotlin.daemon.jvmargs=-Xmx2048m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

# ─────────────────────────────────────────────────────────────────────────────
#  جلوگیری از دانلود خودکار پکیج‌های SDK از dl.google.com
#
#  در ایران dl.google.com مسدود است و AGP هنگام سینک تلاش می‌کند فهرست
#  پکیج‌ها (repository2-*.xml) را از آن بگیرد که منجر به خطای
#  «Failed to download any source lists» می‌شود.
#
#  با false کردن این گزینه، Gradle به‌جای تلاش بی‌فایده، خطای روشن
#  «پکیج X نصب نیست» می‌دهد و شما آن را با scripts/fetch-android-sdk.sh
#  از میرور مایکت نصب می‌کنید.
#
#  ⚠️ روی GitHub Actions این مقدار باید true باشد — runner به گوگل دسترسی
#     دارد و باید بتواند اجزای SDK را خودش دانلود کند. Workflowها این را
#     با سوییچ -Pandroid.builder.sdkDownload=true بازنویسی می‌کنند.
# ─────────────────────────────────────────────────────────────────────────────
android.builder.sdkDownload=false
