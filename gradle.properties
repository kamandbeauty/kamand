org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
kotlin.incremental=true

# ─────────────────────────────────────────────────────────────────────────────
#  جلوگیری از دانلود خودکار پکیج‌های SDK از dl.google.com
#
#  در ایران dl.google.com مسدود است و AGP هنگام سینک تلاش می‌کند فهرست
#  پکیج‌ها (repository2-*.xml) را از آن بگیرد که منجر به خطای
#  «Failed to download any source lists» می‌شود.
#
#  با false کردن این گزینه، Gradle به‌جای تلاش بی‌فایده، خطای روشن
#  «پکیج X نصب نیست» می‌دهد و شما آن را با scripts/fetch-android-sdk.sh
#  از میرور مایکت نصب می‌کنید.
# ─────────────────────────────────────────────────────────────────────────────
android.builder.sdkDownload=false
