name: fale_hafez
description: "فالمو بگیر - اپلیکیشن فال حافظ"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.1
  get: ^4.6.6
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  # تولید آیکون برنامه: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/appicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/background/
    - assets/fonts/
    - assets/data/

  # فونت داخلی وزیرمتن (بدون نیاز به اینترنت)
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
