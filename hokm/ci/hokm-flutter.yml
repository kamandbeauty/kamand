name: Hokm (Flutter) CI

on:
  push:
    branches: ["arena/**", "memory", "master", "main"]
    paths:
      - "hokm/**"
      - ".github/workflows/hokm-flutter.yml"
  pull_request:
    paths:
      - "hokm/**"
      - ".github/workflows/hokm-flutter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: hokm
        run: flutter pub get

      - name: Analyze
        id: analyze
        working-directory: hokm
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
            | tail -c 40000 | tee "$GITHUB_WORKSPACE/analyze.txt"

      - name: Run engine & AI tests
        id: tests
        if: always()
        working-directory: hokm
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 \
            | tail -c 40000 | tee "$GITHUB_WORKSPACE/test.txt"

      - name: Publish diagnostics as commit comment
        if: always() && (steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 🎴 Hokm CI diagnostics"
            echo ""
            echo "- analyze: **${{ steps.analyze.outcome }}**"
            echo "- tests: **${{ steps.tests.outcome }}**"
            echo ""
            echo "<details><summary>flutter analyze</summary>"
            echo ""
            echo '```'
            cat "$GITHUB_WORKSPACE/analyze.txt" 2>/dev/null || echo "(not available)"
            echo '```'
            echo "</details><details><summary>flutter test</summary>"
            echo ""
            echo '```'
            cat "$GITHUB_WORKSPACE/test.txt" 2>/dev/null || echo "(not available)"
            echo '```'
            echo "</details>"
          } > "$GITHUB_WORKSPACE/report.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$GITHUB_WORKSPACE/report.md"

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK (release)
        working-directory: hokm
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hokm-release-apk
          path: hokm/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
