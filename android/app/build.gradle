plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// ── Release signing ────────────────────────────────────────────────────
// Reads from environment (CI secrets) or android/key.properties (local).
// Falls back to debug signing when neither is present so the project
// always builds; CI enforces release signing separately.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def signingValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    environmentValue != null ? environmentValue : keystoreProperties.getProperty(propertyName)
}

def releaseStorePath = signingValue('TALE_MAN_RELEASE_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('TALE_MAN_RELEASE_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('TALE_MAN_RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('TALE_MAN_RELEASE_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [
    releaseStorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.toString().isEmpty() }

android {
    namespace "com.ruby.factor_ruby"
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ruby.factor_ruby"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resourceConfigurations += ['fa', 'en']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Local/fallback builds only; CI release builds are signed
                // with the repository release keystore.
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
