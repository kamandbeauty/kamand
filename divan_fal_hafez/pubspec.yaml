name: fale_hafez
description: "دیوان و فال حافظ - غزلیات، رباعیات، قطعات، قصاید و منتسبات به همراه فال"
publish_to: 'none'

version: 1.6.1+24

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_spinkit: ^5.2.0
  get: ^4.6.6
  audioplayers: ^5.2.1

  # اشتراک‌گذاری اشعار
  share_plus: ^7.2.2

  # ذخیرهٔ آفلاین تنظیمات و اشعار دلخواه
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  # تولید آیکون برنامه: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appicon.png"
  adaptive_icon_background: "#193B49"
  adaptive_icon_foreground: "../tool/icon/appicon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/background/
    - assets/fonts/
    - assets/data/

  # قلم‌های داخلی (بدون نیاز به اینترنت)
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Sahel
      fonts:
        - asset: assets/fonts/Sahel.ttf
        - asset: assets/fonts/Sahel-Bold.ttf
          weight: 700
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
        - asset: assets/fonts/Shabnam-Bold.ttf
    - family: Nastaliq
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Var.ttf
          weight: 700
