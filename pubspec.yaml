name: factor_ruby
description: "فاکتور ساز روبی - اپلیکیشن اندرویدی صدور فاکتور و مدیریت مالی کسب‌وکار"
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (raw sqlite3, no codegen)
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.21

  # Files & Paths
  path_provider: ^2.1.2
  path: ^1.9.0
  image_picker: ^1.0.8
  image: ^4.3.0
  file_picker: ^8.1.7

  # Share invoice image / file
  share_plus: ^10.1.4

  # Save image to device gallery
  gal: ^2.3.0

  # Local key-value persistence
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # Account, API and Cafe Bazaar subscription
  google_sign_in: ^6.2.2
  http: ^1.2.2
  flutter_poolakey: ^2.2.0+1.0.0

  # Persian Calendar & Date
  shamsi_date: ^1.0.2
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.webp
    - assets/images/ruby_fox_mascot.png
    - assets/images/rubilogo.jpg
    - assets/images/banks/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
