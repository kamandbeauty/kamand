name: factor_ruby
description: "فاکتور روبی - اپلیکیشن اندرویدی صدور فاکتور و مدیریت مالی کسب‌وکار"
publish_to: 'none'
version: 5.8.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (raw sqlite3, no codegen)
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.21

  # Files & Paths
  path_provider: ^2.1.2
  path: ^1.9.0

  # Persian Calendar & Date
  shamsi_date: ^1.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
