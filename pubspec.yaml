name: factor_fida
description: "فاکتور فیدا - اپلیکیشن اندرویدی صدور فاکتور و مدیریت مالی کسب‌وکار"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0

  # Key-Value Storage
  shared_preferences: ^2.2.2

  # Persian Calendar & Date
  shamsi_date: ^1.0.2
  intl: ^0.19.0

  # PDF, Printing & Sharing
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^8.0.2

  # QR Code
  qr_flutter: ^4.1.0

  # Biometric & Local Security
  local_auth: ^2.1.8

  # File Picker
  file_picker: ^8.0.0

  # UI Icons & Helpers
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
