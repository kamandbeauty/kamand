name: taalebin
description: "طالع بین — طالع‌بینی شخصی‌سازی‌شده بر اساس برج تولد (نسخهٔ آفلاین و فارسی)"
publish_to: 'none'
version: 1.12.0+25

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (SQLite via sqlite3 FFI — no codegen needed)
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.21

  # Storage paths
  path_provider: ^2.1.2

  # Persian Calendar
  shamsi_date: ^1.0.2

  # Key-Value Storage for settings
  shared_preferences: ^2.2.2

  # UI Icons
  cupertino_icons: ^1.0.6

  # Open the online privacy page (intent-based — no INTERNET permission)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/zodiac_art/
    - assets/emblems/
    - assets/theme/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    # Fallback font covering the zodiac symbols (U+2648–U+2653)
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
