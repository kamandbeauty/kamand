<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIARY — پیش‌نمایش طراحی</title>
<style>
  @font-face{font-family:Vazirmatn;src:url('vazirmatn_regular.ttf') format('truetype');font-weight:400}
  @font-face{font-family:Vazirmatn;src:url('vazirmatn_medium.ttf') format('truetype');font-weight:500}
  @font-face{font-family:Vazirmatn;src:url('vazirmatn_semibold.ttf') format('truetype');font-weight:600}
  @font-face{font-family:Vazirmatn;src:url('vazirmatn_bold.ttf') format('truetype');font-weight:700}

  :root{
    --coral:#FF6B6B; --orange:#FF9F45; --yellow:#FFC93C; --mint:#2ECC9B;
    --turquoise:#31C8E6; --purple:#7C5CFF; --pink:#FF7EB6;
    --bg:#FDF7F4; --surface:#fff; --muted:#F6F1FA;
    --text:#241F2E; --text2:#6C6579; --grad1:#FFF1EA; --grad2:#F2ECFF;
    --shadow:0 3px 14px rgba(36,31,46,.07);
  }
  body[data-palette="green"]{--coral:#2FB37C;--purple:#5BC0A6;--orange:#FFC93C;--bg:#F5FAF5;--surface:#fff;--muted:#EBF5EE;--text:#1C2B24;--text2:#5F7168;--grad1:#E9F7EC;--grad2:#F3FBF4}
  body[data-palette="ocean"]{--coral:#2A9DD6;--purple:#31C8E6;--orange:#7C5CFF;--bg:#F4F9FD;--surface:#fff;--muted:#E8F2FA;--text:#172733;--text2:#5C7182;--grad1:#E5F4FC;--grad2:#EFF3FF}
  body[data-palette="pink"]{--coral:#EE6FA6;--purple:#FF9EC4;--orange:#9B6DFF;--bg:#FEF6F9;--surface:#fff;--muted:#FAECF3;--text:#2E1F27;--text2:#7A6270;--grad1:#FDEDF4;--grad2:#F7EEFF}
  body[data-palette="sunset"]{--coral:#F2743F;--purple:#FFA45B;--orange:#E0518B;--bg:#FFF8F2;--surface:#fff;--muted:#FBEDE2;--text:#31211A;--text2:#7C665B;--grad1:#FFEEDE;--grad2:#FFE9EC}
  body[data-palette="night"]{--coral:#5B5BD6;--purple:#8A7CFF;--orange:#31C8E6;--bg:#F6F6FC;--surface:#fff;--muted:#ECECF8;--text:#1F1F33;--text2:#63637D;--grad1:#EDEDFB;--grad2:#F4F1FF}
  body.dark[data-palette="green"]{--coral:#4CD69A;--purple:#74D8BE;--orange:#FFD466;--bg:#101711;--surface:#18211B;--muted:#1F2C25;--text:#ECF6EE;--text2:#9DB3A6;--grad1:#17251C;--grad2:#121A15}
  body.dark[data-palette="ocean"]{--coral:#4FC3F0;--purple:#57D6EE;--orange:#9B84FF;--bg:#0E151C;--surface:#161F28;--muted:#1D2A35;--text:#E9F3FA;--text2:#97AEBF;--grad1:#14212B;--grad2:#101820}
  body.dark[data-palette="pink"]{--coral:#FF8FBB;--purple:#FFB3D2;--orange:#B795FF;--bg:#1A1218;--surface:#241A20;--muted:#30222B;--text:#F8ECF2;--text2:#BCA3B0;--grad1:#261A22;--grad2:#1D141A}
  body.dark[data-palette="sunset"]{--coral:#FF9257;--purple:#FFBB7D;--orange:#FF7BA8;--bg:#1A1310;--surface:#241B16;--muted:#32241C;--text:#F9EDE4;--text2:#C0A697;--grad1:#281C15;--grad2:#1D1511}
  body.dark[data-palette="night"]{--coral:#8E8AFF;--purple:#A79CFF;--orange:#57D6EE;--bg:#0D0D14;--surface:#15151F;--muted:#1E1E2C;--text:#EDEDF7;--text2:#9E9EB8;--grad1:#161623;--grad2:#101018}
  body.dark{
    --bg:#14131A; --surface:#1E1C26; --muted:#262433; --text:#F3EFF8; --text2:#A9A2B8;
    --grad1:#221E2E; --grad2:#191824;
    --coral:#FF8080; --orange:#FFB067; --yellow:#FFD466; --mint:#4BD9AE;
    --turquoise:#57D6EE; --purple:#9B84FF; --pink:#FF97C4;
    --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Vazirmatn,system-ui,sans-serif;background:#ece7f3;
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 12px;min-height:100vh}
  body[data-palette="green"]{--coral:#2FB37C;--purple:#5BC0A6;--orange:#FFC93C;--bg:#F5FAF5;--surface:#fff;--muted:#EBF5EE;--text:#1C2B24;--text2:#5F7168;--grad1:#E9F7EC;--grad2:#F3FBF4}
  body[data-palette="ocean"]{--coral:#2A9DD6;--purple:#31C8E6;--orange:#7C5CFF;--bg:#F4F9FD;--surface:#fff;--muted:#E8F2FA;--text:#172733;--text2:#5C7182;--grad1:#E5F4FC;--grad2:#EFF3FF}
  body[data-palette="pink"]{--coral:#EE6FA6;--purple:#FF9EC4;--orange:#9B6DFF;--bg:#FEF6F9;--surface:#fff;--muted:#FAECF3;--text:#2E1F27;--text2:#7A6270;--grad1:#FDEDF4;--grad2:#F7EEFF}
  body[data-palette="sunset"]{--coral:#F2743F;--purple:#FFA45B;--orange:#E0518B;--bg:#FFF8F2;--surface:#fff;--muted:#FBEDE2;--text:#31211A;--text2:#7C665B;--grad1:#FFEEDE;--grad2:#FFE9EC}
  body[data-palette="night"]{--coral:#5B5BD6;--purple:#8A7CFF;--orange:#31C8E6;--bg:#F6F6FC;--surface:#fff;--muted:#ECECF8;--text:#1F1F33;--text2:#63637D;--grad1:#EDEDFB;--grad2:#F4F1FF}
  body.dark[data-palette="green"]{--coral:#4CD69A;--purple:#74D8BE;--orange:#FFD466;--bg:#101711;--surface:#18211B;--muted:#1F2C25;--text:#ECF6EE;--text2:#9DB3A6;--grad1:#17251C;--grad2:#121A15}
  body.dark[data-palette="ocean"]{--coral:#4FC3F0;--purple:#57D6EE;--orange:#9B84FF;--bg:#0E151C;--surface:#161F28;--muted:#1D2A35;--text:#E9F3FA;--text2:#97AEBF;--grad1:#14212B;--grad2:#101820}
  body.dark[data-palette="pink"]{--coral:#FF8FBB;--purple:#FFB3D2;--orange:#B795FF;--bg:#1A1218;--surface:#241A20;--muted:#30222B;--text:#F8ECF2;--text2:#BCA3B0;--grad1:#261A22;--grad2:#1D141A}
  body.dark[data-palette="sunset"]{--coral:#FF9257;--purple:#FFBB7D;--orange:#FF7BA8;--bg:#1A1310;--surface:#241B16;--muted:#32241C;--text:#F9EDE4;--text2:#C0A697;--grad1:#281C15;--grad2:#1D1511}
  body.dark[data-palette="night"]{--coral:#8E8AFF;--purple:#A79CFF;--orange:#57D6EE;--bg:#0D0D14;--surface:#15151F;--muted:#1E1E2C;--text:#EDEDF7;--text2:#9E9EB8;--grad1:#161623;--grad2:#101018}
  body.dark{background:#0d0c12}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .toolbar button{font-family:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;
    padding:9px 16px;background:#fff;color:#241F2E;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .toolbar button.on{background:var(--coral);color:#fff}

  .phone{width:390px;max-width:100%;height:800px;border-radius:38px;overflow:hidden;position:relative;
    background:var(--bg);box-shadow:0 24px 60px rgba(20,14,40,.28);display:flex;flex-direction:column;
    transition:background .4s}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;
    background:linear-gradient(180deg,var(--grad1),var(--bg) 42%);padding:14px 20px 110px;transition:background .4s}
  .screen::-webkit-scrollbar{width:0}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 2px}
  .topbar h1{margin:0;font-size:17px;font-weight:700;color:var(--text)}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text2);
    font-size:18px;cursor:pointer;display:grid;place-items:center}

  h2.greet{margin:0;font-size:20px;font-weight:600;color:var(--text);line-height:1.55}
  .sub{margin:4px 0 0;font-size:14px;color:var(--text2)}
  .daterow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .daterow .date{font-size:12px;font-weight:500;color:var(--text2);opacity:.85}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;
    font-size:12px;font-weight:500}

  .card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:12px;
    transition:background .4s}
  body.dark .card{border:1px solid rgba(255,255,255,.12)}

  .progress-card{display:flex;align-items:center;gap:18px;padding:18px}
  .ring{position:relative;width:112px;height:112px;flex:none}
  .ring svg{transform:rotate(-90deg) scaleX(-1)}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct{font-size:18px;font-weight:600;color:var(--text)}
  .ring .of{font-size:12px;font-weight:500;color:var(--text2)}
  .plabel{font-size:12px;font-weight:500;color:var(--text2)}
  .pmsg{font-size:16px;font-weight:600;color:var(--text);margin-top:4px}

  .section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 2px}
  .section h3{margin:0;font-size:16px;font-weight:600;color:var(--text)}
  .section span{font-size:14px;font-weight:600;color:var(--text2)}

  .task{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:22px;
    box-shadow:var(--shadow);padding:14px;margin-top:10px;position:relative;overflow:hidden;
    transition:background .4s,transform .25s cubic-bezier(.2,.9,.3,1.3),opacity .3s}
  body.dark .task{border:1px solid rgba(255,255,255,.12)}
  .task.done{opacity:.62}
  .cb{width:26px;height:26px;border-radius:50%;border:2px solid rgba(108,101,121,.45);flex:none;
    display:grid;place-items:center;cursor:pointer;transition:.22s;background:transparent}
  .cb svg{width:15px;height:15px;opacity:0;transform:scale(.4);transition:.22s}
  .task.done .cb{border-color:var(--accent);background:var(--accent)}
  .task.done .cb svg{opacity:1;transform:scale(1)}
  .tbody{flex:1;min-width:0}
  .ttitle{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px}
  .task.done .ttitle span.txt{text-decoration:line-through}
  .tmeta{margin-top:6px;font-size:11px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.6}
  .prio{display:flex;align-items:flex-end;gap:2px;flex:none}
  .prio i{width:3px;border-radius:2px;display:block}

  .fab{position:absolute;left:24px;bottom:96px;width:62px;height:62px;border-radius:50%;border:0;
    background:linear-gradient(135deg,var(--coral),var(--purple));color:#fff;font-size:30px;font-weight:300;
    cursor:pointer;box-shadow:0 10px 24px rgba(255,107,107,.42);display:grid;place-items:center;
    transition:transform .2s}
  .fab:active{transform:scale(.93)}

  .nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--surface);
    display:flex;align-items:flex-start;padding-top:10px;transition:background .4s}
  body.dark .nav{border-top:1px solid rgba(255,255,255,.1)}
  .nav button{flex:1;background:0;border:0;font-family:inherit;cursor:pointer;color:var(--text2);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500}
  .nav button.on{color:var(--coral)}
  .nav .ind{padding:4px 18px;border-radius:999px;transition:.2s;font-size:17px;line-height:1.3}
  .nav button.on .ind{background:rgba(255,107,107,.14)}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between}
  .cal-nav{display:flex;align-items:center;gap:2px}
  .cal-nav b{font-size:16px;font-weight:600;color:var(--text);padding:0 4px}
  .chip{border:0;font-family:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:9px 16px;
    background:var(--muted);color:var(--text2);cursor:pointer;transition:.2s}
  .chip.on{background:var(--coral);color:#fff}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px}
  .wk div{text-align:center;font-size:11px;font-weight:500;color:var(--text2)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);margin-top:4px}
  .day{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .day .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;
    font-weight:600;color:var(--text);transition:.22s}
  .day.today .n{background:rgba(255,107,107,.14);color:#c94b4b;border:1.5px solid rgba(255,107,107,.55)}
  body.dark .day.today .n{color:var(--coral)}
  .day.sel .n{background:var(--coral);color:#fff;transform:scale(1.06)}
  .day .ind{display:flex;gap:2px;height:5px}
  .day .ind i{width:4px;height:4px;border-radius:50%;background:var(--orange);display:block}
  .day.sel .ind i{background:#fff}
  .day.alldone .ind i{background:var(--mint)}

  /* stats */
  .stats{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;border-radius:22px;padding:14px;text-align:center}
  .stat b{display:block;font-size:18px;font-weight:600}
  .stat span{font-size:11px;font-weight:500;color:var(--text2)}
  .bars{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .bar{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar .track{width:22px;height:92px;border-radius:11px;background:var(--muted);
    display:flex;align-items:flex-end;overflow:hidden}
  .bar .fill{width:100%;border-radius:11px;background:linear-gradient(180deg,var(--coral),var(--purple));
    transition:height .7s cubic-bezier(.2,.8,.3,1)}
  .bar small{font-size:11px;font-weight:500;color:var(--text2)}
  .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--purple));
    display:grid;place-items:center;color:#fff;font-size:20px;font-weight:600;flex:none}
  .row{display:flex;align-items:center;gap:14px}
  .empty{text-align:center;padding:40px 24px}
  .empty .circle{width:84px;height:84px;border-radius:50%;background:var(--muted);margin:0 auto 16px;
    display:grid;place-items:center;font-size:32px}
  .empty h4{margin:0;font-size:16px;font-weight:600;color:var(--text)}
  .empty p{margin:6px 0 0;font-size:14px;color:var(--text2)}
  .hide{display:none}
  .quickadd{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:20px;
    box-shadow:var(--shadow);padding:4px 6px;margin-top:12px}
  body.dark .quickadd{border:1px solid rgba(255,255,255,.12)}
  .quickadd input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;
    color:var(--text);padding:12px 4px}
  .quickadd input::placeholder{color:var(--text2)}
  .quickadd button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;font-size:17px;
    border-radius:50%;color:var(--text2)}
  .quickadd button.add{color:var(--coral);font-size:22px}
  .quickadd button:disabled{opacity:.35;cursor:default}
  .task.dragging{box-shadow:0 12px 28px rgba(0,0,0,.18);transform:scale(1.03)}
  .grip{cursor:grab;color:var(--text2);opacity:.5;font-size:15px;padding:0 2px;line-height:1;user-select:none}
  .badge{font-size:10px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--muted);color:var(--text2)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .sw{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:58px}
  .sw .circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:19px;
    border:1px solid rgba(0,0,0,.08);transition:.2s}
  .sw.on .circle{outline:3px solid var(--text);outline-offset:2px}
  .sw small{font-size:10px;color:var(--text2);font-weight:500}
  .widget{width:300px;border-radius:22px;background:#FDF7F4;padding:14px;
    box-shadow:0 10px 30px rgba(20,14,40,.18);font-family:Vazirmatn}
  body.dark .widget{background:#1E1C26}
  .widget .wh{display:flex;align-items:center;gap:8px}
  .widget .wh b{flex:1;font-size:15px;color:#241F2E}
  body.dark .widget .wh b{color:#F3EFF8}
  .widget .wh span{font-size:13px;color:#6C6579}
  body.dark .widget .wh span,body.dark .widget .wrow .tm{color:#A9A2B8}
  body.dark .widget .bar{background:#2C2A38}
  body.dark .widget .wrow.done .t{color:#7E778C}
  .widget .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--purple));font-size:19px;cursor:pointer}
  .widget .bar{height:6px;border-radius:3px;background:#F0EAF5;margin-top:8px;overflow:hidden}
  .widget .bar i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--coral),var(--purple));transition:width .5s}
  .widget .wrow{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;font-size:14px}
  .widget .wrow .c{width:20px;text-align:center;color:var(--coral);font-weight:600}
  .widget .wrow .t{flex:1;color:#241F2E}
  body.dark .widget .wrow .t{color:#F3EFF8}
  .widget .wrow.done .t{text-decoration:line-through;color:#8A8595}
  .widget .wrow .tm{font-size:12px;color:#6C6579}
  .wlabel{font-size:12px;color:#6b6579;text-align:center;margin-top:10px}
  body.dark .wlabel{color:#9a93a8}
  .celebrate{border-radius:22px;padding:16px;text-align:center;background:rgba(46,204,155,.14);margin-top:12px;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .celebrate .em{font-size:26px}
  .celebrate h4{margin:2px 0 0;font-size:16px;font-weight:600;color:var(--text)}
  .celebrate p{margin:2px 0 0;font-size:14px;color:var(--text2)}
  .note{color:#6b6579;font-size:12px;text-align:center;max-width:390px;line-height:1.8}
  body.dark .note{color:#9a93a8}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-fa" class="on">فارسی (شمسی)</button>
  <button id="btn-en">English (Gregorian)</button>
  <button id="btn-theme">🌙 حالت تیره</button>
</div>

<div class="phone">
  <div class="topbar"><h1 id="appname">خاطرات</h1><button class="icon-btn">🔍</button></div>
  <div class="screen" id="screen"></div>
  <button class="fab" id="fab">+</button>
  <div class="nav" id="nav"></div>
</div>

<div id="widgetBox"></div>

<p class="note" id="note">
  پیش‌نمایش زندهٔ طراحی — همان توکن‌های رنگ، فونت وزیرمتن، تقویم شمسی و اعداد فارسیِ اپ Compose.<br>
  روی تیک کارها، روزهای تقویم و تب‌های پایین بزنید.
</p>

<script>
// ---------- Jalali conversion (same algorithm as JalaliDate.kt) ----------
const BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
const tdiv=(a,b)=>Math.trunc(a/b), tmod=(a,b)=>a-b*Math.trunc(a/b);
function params(jy){let gy=jy+621,leapJ=-14,jp=BREAKS[0],jump=0;
  for(let i=1;i<BREAKS.length;i++){const jm=BREAKS[i];jump=jm-jp;if(jy<jm)break;
    leapJ+=tdiv(jump,33)*8+tdiv(tmod(jump,33),4);jp=jm;}
  let n=jy-jp;leapJ+=tdiv(n,33)*8+tdiv(tmod(n,33)+3,4);
  if(tmod(jump,33)===4&&jump-n===4)leapJ++;
  const leapG=tdiv(gy,4)-tdiv((tdiv(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+tdiv(jump+4,33)*33;
  let leap=tmod(tmod(n+1,33)-1,4); if(leap===-1)leap=4;
  return {leap,gy,march};}
function g2d(gy,gm,gd){const a=tdiv(gm-8,6),y=gy+a;
  let d=tdiv((y+100100)*1461,4)+tdiv(153*tmod(gm+9,12)+2,5)+gd-34840408;
  return d-tdiv(tdiv(y+100100,100)*3,4)+752;}
function d2g(jdn){let j=4*jdn+139361631;j+=tdiv(tdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=tdiv(tmod(j,1461),4)*5+308,gd=tdiv(tmod(i,153),5)+1,gm=tmod(tdiv(i,153),12)+1,
    gy=tdiv(j,1461)-100100+tdiv(8-gm,6);return [gy,gm,gd];}
function j2g(jy,jm,jd){const p=params(jy);return d2g(g2d(p.gy,3,p.march)+(jm-1)*31-tdiv(jm,7)*(jm-7)+jd-1);}
function g2j(gy,gm,gd){const jdn=g2d(gy,gm,gd);let jy=gy-621;const p=params(jy);
  let k=jdn-g2d(gy,3,p.march);
  if(k>=0){if(k<=185)return [jy,1+tdiv(k,31),tmod(k,31)+1];k-=186;}
  else{jy--;k+=179;if(p.leap===1)k++;}
  return [jy,7+tdiv(k,30),tmod(k,30)+1];}
const isLeapJ=jy=>params(jy).leap===0;
const jMonthLen=(jy,jm)=>jm<=6?31:(jm<=11?30:(isLeapJ(jy)?30:29));

    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">

    const g=j2g(selJ[0],selJ[1],selJ[2]); const d=new Date(g[0],g[1]-1,1);
    len=new Date(g[0],g[1],0).getDate(); lead=d.getDay(); head=`${GM[g[1]-1]} ${g[0]}`;

function bind(){
  // quick add
  const qa=document.getElementById('qa'), qaAdd=document.getElementById('qaAdd'), mic=document.getElementById('mic');
  if(qa){
    qa.oninput=()=>{ qaAdd.disabled=!qa.value.trim(); };
    const add=()=>{ const v=qa.value.trim(); if(!v)return;
      TASKS.push({id:Math.max(0,...TASKS.map(t=>t.id))+1,fa:v,en:v,cat:null,t:null,d:0,p:2,done:false});
      celebrated=false; render(); };
    qaAdd.onclick=add;
    qa.onkeydown=e=>{ if(e.key==='Enter') add(); };
    mic.onclick=()=>{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){ alert(LANG==='fa'?'ورود صوتی روی این مرورگر در دسترس نیست':'Voice input not available'); return; }
      const r=new SR(); r.lang=LANG==='fa'?'fa-IR':'en-US';
      mic.textContent='🔴'; r.start();
      r.onresult=e=>{ qa.value=e.results[0][0].transcript; qaAdd.disabled=false; };
      r.onend=()=>{ mic.textContent='🎤'; };
      r.onerror=()=>{ mic.textContent='🎤'; };
    };
  }
  // palettes + theme
  document.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{
    PAL=el.dataset.pal; document.body.dataset.palette=PAL; render(); });
  document.querySelectorAll('.chip[data-theme]').forEach(el=>el.onclick=()=>{
    THEME=el.dataset.theme; document.body.classList.toggle('dark',THEME==='dark');
    document.getElementById('btn-theme').textContent=THEME==='dark'?'☀️ حالت روشن':'🌙 حالت تیره';
    render(); });
  // drag & drop reorder
  const zone=document.getElementById('dragzone');
  if(zone){
    let dragEl=null;
    zone.querySelectorAll('.task').forEach(el=>{
      el.ondragstart=()=>{ dragEl=el; el.classList.add('dragging'); };
      el.ondragend=()=>{ el.classList.remove('dragging'); dragEl=null;
        const ids=[...zone.querySelectorAll('.task')].map(x=>+x.dataset.id);
        const rest=TASKS.filter(t=>!ids.includes(t.id));
        const moved=ids.map(id=>TASKS.find(t=>t.id===id));
        TASKS=[...rest.slice(0,3),...moved,...rest.slice(3)];
      };
      el.ondragover=e=>{ e.preventDefault();
        if(!dragEl||dragEl===el)return;
        const r=el.getBoundingClientRect();
        const after=(e.clientY-r.top)/r.height>0.5;
        zone.insertBefore(dragEl, after?el.nextSibling:el);
      };
    });
  }
  document.querySelectorAll('.task .cb').forEach(cb=>cb.onclick=e=>{
    const id=+e.target.closest('.task').dataset.id;
    const t=TASKS.find(x=>x.id===id); t.done=!t.done;
    const dated=TASKS.filter(x=>x.d===0);
    celebrated = dated.length>0 && dated.every(x=>x.done);
    render();
  });
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
  document.querySelectorAll('.day[data-day]').forEach(d=>d.onclick=()=>{
    if(LANG==='fa')selJ[2]=+d.dataset.day;
    else{const g=j2g(selJ[0],selJ[1],selJ[2]);selJ=g2j(g[0],g[1],+d.dataset.day);}
    render();});
  const pm=document.getElementById('prevM'),nm=document.getElementById('nextM'),tb=document.getElementById('todayBtn');
  const shift=k=>{let[y,m]=selJ;m+=k;if(m>12){m=1;y++}if(m<1){m=12;y--}
    selJ=[y,m,Math.min(selJ[2],jMonthLen(y,m))];render();};
  if(pm)pm.onclick=()=>shift(-1); if(nm)nm.onclick=()=>shift(1);
  if(tb)tb.onclick=()=>{selJ=[TJ[0],TJ[1],TJ[2]];render();};
}
document.getElementById('btn-fa').onclick=()=>{LANG='fa';
  document.getElementById('btn-fa').classList.add('on');document.getElementById('btn-en').classList.remove('on');render();};
document.getElementById('btn-en').onclick=()=>{LANG='en';
  document.getElementById('btn-en').classList.add('on');document.getElementById('btn-fa').classList.remove('on');render();};
document.getElementById('btn-theme').onclick=e=>{THEME=THEME==='light'?'dark':'light';
  document.body.classList.toggle('dark');
  e.target.textContent=THEME==='dark'?'☀️ حالت روشن':'🌙 حالت تیره';render();};
document.getElementById('fab').onclick=()=>{
  const id=Math.max(...TASKS.map(t=>t.id))+1;
  TASKS.push({id,fa:'کار جدید ✨',en:'New task ✨',cat:'personal',t:null,p:2,done:false});
  TAB='today';celebrated=false;render();};
render();
</script>
