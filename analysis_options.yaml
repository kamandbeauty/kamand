include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # قوانین سخت‌گیرانه برای کدِ بازی
    unused_import: error
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    prefer_single_quotes: true
    always_use_package_imports: false
    prefer_final_locals: false
    avoid_print: true
