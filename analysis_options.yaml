# analysis_options.yaml — تنظیمات تحلیل ایستای پروژه
#
# CI مرحلهٔ analyze را با --no-fatal-warnings اجرا می‌کند؛ این فایل نویزهای
# info-level رایج را غیرfatal می‌کند تا فقط خطاهای واقعی و هشدارهای مهم
# مانع merge شوند. با ارتقای تدریجی کد، این لیست را کوتاه کنید.
analyzer:
  errors:
    unused_import: ignore
    unnecessary_import: ignore
    unused_element: ignore
    unused_field: ignore
    unused_local_variable: ignore
    deprecation_member_use: ignore
    deprecation_member_use_from_same_package: ignore
    unnecessary_non_null_assertion: ignore
    unnecessary_type_check: ignore
    dead_code: ignore
    avoid_print: ignore
    use_build_context_synchronously: ignore
    unnecessary_this: ignore
    annotate_overrides: ignore
    must_call_super: ignore
