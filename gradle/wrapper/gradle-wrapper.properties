distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ─────────────────────────────────────────────────────────────────────────────
#  آدرس دانلود خودِ توزیع Gradle (حدود ۱۳۰ مگابایت).
#
#  پیش‌فرض روی میرور داخلی جامکو تنظیم شده تا در شرایط فیلترینگ
#  services.gradle.org دانلود متوقف نشود.
#
#  اگر این میرور در دسترس نبود، یکی از گزینه‌های زیر را جایگزین کنید:
#    ۱) میرور کارگадан:
#       https\://mirror.kargadan.ir/gradle/gradle-8.10.2-bin.zip
#    ۲) مخزن ملی سازمان فناوری اطلاعات:
#       https\://archive.ito.gov.ir/gradle/distributions/gradle-8.10.2-bin.zip
#    ۳) منبع رسمی (نیازمند دسترسی بین‌الملل):
#       https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
#
#  ⚠️ نکته: اگر Gradle را از قبل روی سیستم دارید، اصلاً نیازی به دانلود نیست؛
#     کافی است یک‌بار `gradle wrapper --gradle-version 8.10.2` بزنید.
# ─────────────────────────────────────────────────────────────────────────────
distributionUrl=https\://gradle.jamko.ir/distributions/gradle-8.10.2-bin.zip
networkTimeout=60000
# اعتبارسنجی دامنه غیرفعال است چون از میرور استفاده می‌کنیم
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
