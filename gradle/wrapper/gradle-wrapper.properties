distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ─────────────────────────────────────────────────────────────────────────────
#  آدرس دانلود توزیع Gradle (~۱۳۰ مگابایت)
#
#  پیش‌فرض: منبع رسمی — لازم برای GitHub Actions و هر محیط CI.
#
#  ── اگر داخل ایران هستید و این آدرس فیلتر است ────────────────────────────
#  خط زیر را کامنت کنید و به‌جایش میرور مایکت را فعال کنید:
#
#     distributionUrl=https\://maven.myket.ir/gradle/distributions/gradle-8.10.2-bin.zip
#
#  یا اسکریپت زیر را اجرا کنید تا خودکار میرور سالم را انتخاب کند:
#     bash scripts/pick-gradle-mirror.sh          (لینوکس/مک)
#
#  ⚠️ توجه: اگر این فایل را برای استفادهٔ محلی تغییر دادید، هنگام push
#     مراقب باشید — روی GitHub Actions آدرس مایکت ممکن است در دسترس نباشد.
#     بهتر است به‌جای تغییر این فایل، از متغیر محیطی استفاده کنید یا
#     Gradle را از قبل روی سیستم نصب داشته باشید.
# ─────────────────────────────────────────────────────────────────────────────
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
