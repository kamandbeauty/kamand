distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ─────────────────────────────────────────────────────────────────────────────
#  آدرس دانلود خودِ توزیع Gradle (حدود ۱۳۰ مگابایت)
#
#  پیش‌فرض: میرور جامکو (طبق مستندات رسمی jamko.ir)
#  ساختار آدرس:  https://download.jamko.ir/gradle-distributions/gradle-<نسخه>-bin.zip
#
#  ── اگر خطای 404 یا timeout گرفتید، یکی از این‌ها را جایگزین کنید ──────────
#
#    ۱) منبع رسمی (اگر اینترنت بین‌الملل دارید — مطمئن‌ترین):
#       distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
#
#    ۲) میرور کارگادان:
#       distributionUrl=https\://mirror.kargadan.ir/gradle/distributions/gradle-8.10.2-bin.zip
#
#    ۳) مخزن ملی سازمان فناوری اطلاعات:
#       distributionUrl=https\://archive.ito.gov.ir/gradle/distributions/gradle-8.10.2-bin.zip
#
#  ⚠️ بهترین راه دور زدن این مرحله:
#     اگر Gradle را روی سیستم نصب دارید، اصلاً نیازی به دانلود نیست —
#     یک‌بار این را بزنید تا wrapper با نسخهٔ محلی ساخته شود:
#         gradle wrapper --gradle-version 8.10.2
#
#  💡 اگر 404 گرفتید، اول در مرورگر باز کنید و ببینید فایل هست یا نه؛
#     نسخهٔ موجود روی میرور ممکن است متفاوت باشد (مثلاً 8.9 یا 8.11).
#     در آن صورت نسخه را در این خط و در `gradle-8.10.2` هماهنگ کنید.
# ─────────────────────────────────────────────────────────────────────────────
distributionUrl=https\://download.jamko.ir/gradle-distributions/gradle-8.10.2-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
