distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ─────────────────────────────────────────────────────────────────────────────
#  آدرس دانلود خودِ توزیع Gradle (حدود ۱۳۰ مگابایت)
#
#  پیش‌فرض: میرور مایکت — طبق مستندات رسمی خودشان:
#      https://maven.myket.ir/services/gradle-wrapper.html
#
#  ساختار آدرس:
#      https://maven.myket.ir/gradle/distributions/gradle-<نسخه>-bin.zip
#
#  ── اگر خطا گرفتید، این گزینه‌ها را امتحان کنید ───────────────────────────
#
#    ۱) نسخهٔ دیگر روی همین میرور (مایکت در مستنداتش 8.13 را مثال زده):
#       distributionUrl=https\://maven.myket.ir/gradle/distributions/gradle-8.13-bin.zip
#
#    ۲) منبع رسمی (اگر اینترنت بین‌الملل دارید):
#       distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
#
#    ۳) تست خودکار همهٔ میرورها:
#       bash scripts/pick-gradle-mirror.sh
#
#  ⚠️ بهترین راه دور زدن کامل این مرحله:
#     اگر Gradle روی سیستم نصب است، اصلاً نیازی به دانلود نیست —
#         gradle wrapper --gradle-version 8.10.2
#     یا پروژه را در Android Studio باز کنید (خودش Gradle داخلی دارد).
# ─────────────────────────────────────────────────────────────────────────────
distributionUrl=https\://maven.myket.ir/gradle/distributions/gradle-8.10.2-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
