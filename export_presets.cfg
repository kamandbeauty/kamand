cat > .github/workflows/android-build.yml <<'EOF'
name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"
  GODOT_DIR: "/home/runner/godot"
  GODOT_TEMPLATES: "/home/runner/.local/share/godot/export_templates/4.5.1.stable"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          binary=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)
          test -n "$binary" || { echo "Godot binary not found"; exit 1; }
          mv "$binary" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_TEMPLATES"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          curl --fail --location --retry 3 "$url" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$GODOT_TEMPLATES/"
          test -f "$GODOT_TEMPLATES/android_debug.apk" || { echo "Android export template missing"; exit 1; }

      - name: Verify toolchain
        run: |
          set -euo pipefail
          "$GODOT_DIR/godot" --version
          java -version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0'
          test -f export_presets.cfg

      - name: Validate project and logic
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s "$GODOT_DIR/godot" --headless --path . --editor --quit --verbose
          timeout 60s "$GODOT_DIR/godot" --headless --path . --script res://tests/test_game_logic.gd
          timeout 45s "$GODOT_DIR/godot" --headless --path . --quit-after 5

      - name: Export ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_DIR/godot" --headless --path . --export-debug "Android ARM64 Debug" build/android/Level1-Visual-Test.apk
          test -s build/android/Level1-Visual-Test.apk || { echo "APK was not generated"; exit 1; }
          file build/android/Level1-Visual-Test.apk
          unzip -l build/android/Level1-Visual-Test.apk | grep -E 'lib/arm64-v8a|project.godot' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: level1-android-apk
          path: build/android/Level1-Visual-Test.apk
          if-no-files-found: error
          retention-days: 14
EOF
git add export_presets.cfg .github/workflows/android-build.yml && git commit -m 'Add GitHub Android APK build pipeline' && git push origin arena/01a0263a-kamand || true
git status --short && git log -1 --oneline
