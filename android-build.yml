name: Android Debug Build

# ─────────────────────────────────────────────────────────────────────────────
#  بیلد خودکار نسخهٔ Debug روی هر push و pull request
#  خروجی APK به‌عنوان Artifact ذخیره می‌شود و از بخش Actions قابل دانلود است.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'dist/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'dist/**'
  workflow_dispatch:        # اجرای دستی از تب Actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # کش وابستگی‌ها و توزیع Gradle — اجراهای بعدی چند برابر سریع‌تر می‌شوند
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # بررسی سلامت wrapper پیش از اجرا
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -Pandroid.builder.sdkDownload=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: factoryar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # در صورت شکست، گزارش‌های بیلد برای عیب‌یابی آپلود می‌شوند
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # تست‌های واحد ماژول‌های خالص JVM (محاسبهٔ فاکتور، سود، تقویم جلالی و…)
      - name: Run unit tests
        run: ./gradlew :core:domain:test :core:common:test --stacktrace --no-daemon -Pandroid.builder.sdkDownload=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
          
